<!-- atmosphere-added: 💎 珍珠湾 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐚 珍珠湾 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #001a33 0%, #004466 40%, #001a33 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,26,51,0.95); border-bottom: 1px solid rgba(0,255,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #00ffff; flex: 1; }
    .back-btn { background: none; border: none; color: #00ffff; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(0,26,51,0.85); border: 2px solid #00ffff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #00ffff; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #00ffff; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(0,255,255,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #00ffff; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(0,255,255,0.1); border: 1px solid rgba(0,255,255,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(0,255,255,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #00ffff; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(0,255,255,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #00bfff, #00ffff); border: none; border-radius: 12px; color: #001a33; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(0,255,255,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 💎 珍珠湾 */

    .pearl-glow { position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 40%,rgba(255,182,203,0.12) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(200,220,255,0.1) 0%,transparent 50%);pointer-events:none;z-index:1;animation:glowPulse 5s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100%{opacity:0.6}50%{opacity:1} }
    .bubble-pearl { position:fixed;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),rgba(200,180,255,0.2));animation:pearlRise linear infinite;pointer-events:none;z-index:2;box-shadow:inset -2px -2px 6px rgba(255,255,255,0.3); }
    @keyframes pearlRise { 0%{transform:translateY(0) translateX(0) scale(1);opacity:0.8}25%{transform:translateY(-25vh) translateX(8px)}50%{opacity:0.4;transform:translateY(-50vh) translateX(-4px)}75%{transform:translateY(-75vh) translateX(6px)}100%{transform:translateY(-110vh) translateX(0) scale(0.3);opacity:0} }
    .shell { position:fixed;font-size:28px;opacity:0.12;pointer-events:none;z-index:2;animation:shellBob ease-in-out infinite; }
    @keyframes shellBob { 0%,100%{transform:translateY(0) rotate(-8deg);opacity:0.12}50%{transform:translateY(-18px) rotate(8deg);opacity:0.2} }
    .starfish { position:fixed;font-size:24px;opacity:0.1;pointer-events:none;z-index:2;animation:starRotate ease-in-out infinite; }
    @keyframes starRotate { 0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.1)} }
    .pearl-sparkle { position:fixed;width:5px;height:5px;background:radial-gradient(circle,#fff,#ffd700);border-radius:50%;pointer-events:none;z-index:5;animation:pearlSparkle ease-in-out infinite;box-shadow:0 0 8px #ffd700,0 0 15px #fff; }
    @keyframes pearlSparkle { 0%,100%{opacity:0.1;transform:scale(0.6)}50%{opacity:1;transform:scale(1.4)} }
    .clamshell { position:fixed;font-size:40px;opacity:0.1;pointer-events:none;z-index:2;animation:clamshellOpen ease-in-out infinite; }
    @keyframes clamshellOpen { 0%,100%{transform:rotate(-5deg) scaleX(1)}50%{transform:rotate(5deg) scaleX(1.1)} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,0.45) 100%); }
    .fog { position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 100%,rgba(200,180,255,0.08) 0%,transparent 60%);pointer-events:none;z-index:2;animation:fogDrift 10s ease-in-out infinite; }
    @keyframes fogDrift { 0%,100%{opacity:0.5;transform:translateX(-2%)}50%{opacity:0.9;transform:translateX(2%)} }
</style>
</head>
<body>
  
  <div class="pearl-glow"></div>
  <div class="fog"></div>
  <div id="pearlBubbles"></div>
  <div id="pearlShells"></div>
  <div id="pearlStarfish"></div>
  <div id="pearlClamshells"></div>
  <div id="pearlSparkles"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🐚 珍珠湾</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🐚</div>
      <div class="monster-name" id="monsterName">珍珠蟹</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 珍珠湾任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">采集珍珠: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '珍珠蟹', icon: '🐚', level: 1, hp: 80, attack: 12, exp: 25, gold: 8 },
      { id: 2, name: '海胆怪', icon: '🦔', level: 3, hp: 140, attack: 20, exp: 50, gold: 20 },
      { id: 3, name: '章鱼守卫', icon: '🐙', level: 5, hp: 240, attack: 35, exp: 90, gold: 45 },
      { id: 4, name: '海龟长老', icon: '🐢', level: 8, hp: 480, attack: 65, exp: 180, gold: 90 },
      { id: 5, name: '鲨鱼领航员', icon: '🦈', level: 10, hp: 750, attack: 95, exp: 320, gold: 140 },
      { id: 6, name: '珍珠女王', icon: '👑', level: 15, hp: 1400, attack: 140, exp: 550, gold: 280 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => `<div class="monster-btn" onclick="selectMonster(${m.id})"><div class="monster-btn-icon">${m.icon}</div><div class="monster-btn-name">${m.name}</div><div class="monster-btn-level">Lv.${m.level}</div></div>`).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 珍珠湾任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Pearl atmosphere
    const pb = document.getElementById('pearlBubbles');
    for(let i=0;i<18;i++){const b=document.createElement('div');b.className='bubble-pearl';const s=Math.random()*25+8;b.style.width=b.style.height=s+'px';b.style.left=Math.random()*100+'%';b.style.animationDuration=(Math.random()*8+6)+'s';b.style.animationDelay=(Math.random()*6)+'s';pb.appendChild(b);}
    const ps = document.getElementById('pearlShells');
    ['🐚','🪸','🪸'].forEach((icon,i)=>{const s=document.createElement('div');s.className='shell';s.textContent=icon;s.style.left=(8+i*28)+'%';s.style.bottom=(10+Math.random()*20)+'%';s.style.animationDuration=(3+Math.random()*2)+'s';s.style.animationDelay=(i*1.2)+'s';ps.appendChild(s);});
    const pst = document.getElementById('pearlStarfish');
    ['⭐','🌟','✨'].forEach((icon,i)=>{const s=document.createElement('div');s.className='starfish';s.textContent=icon;s.style.left=(12+i*25)+'%';s.style.top=(15+i*18)+'%';s.style.animationDuration=(2.5+Math.random()*2)+'s';s.style.animationDelay=(i*0.8)+'s';pst.appendChild(s);});
    const pcs = document.getElementById('pearlClamshells');
    ['🦪','🐚'].forEach((icon,i)=>{const c=document.createElement('div');c.className='clamshell';c.textContent=icon;c.style.left=(15+i*35)+'%';c.style.bottom=(8+i*5)+'%';c.style.animationDuration=(4+Math.random()*2)+'s';c.style.animationDelay=(i*2)+'s';pcs.appendChild(c);});
    const psp = document.getElementById('pearlSparkles');
    for(let i=0;i<20;i++){const s=document.createElement('div');s.className='pearl-sparkle';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*80+'%';s.style.animationDuration=(1.5+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*4)+'s';psp.appendChild(s);}

</script>
</body>
</html>
