<!-- atmosphere-added: 🌀 深海漩涡 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌀 深海漩涡 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #000428 0%, #001e3c 20%, #002855 50%, #000428 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,4,40,0.95); border-bottom: 1px solid rgba(128,0,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #8000ff; flex: 1; }
    .back-btn { background: none; border: none; color: #8000ff; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(0,4,40,0.85); border: 2px solid #8000ff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #8000ff; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: vortex 3s linear infinite; }
    @keyframes vortex { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #8000ff; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(128,0,255,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #8000ff; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(128,0,255,0.1); border: 1px solid rgba(128,0,255,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(128,0,255,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #8000ff; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(128,0,255,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #8000ff, #9932cc); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(128,0,255,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 🌀 深海漩涡 */

    .vortex-aura { position:fixed;top:50%;left:50%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent,rgba(80,0,150,0.08),rgba(120,0,200,0.1),rgba(60,0,120,0.06),transparent);pointer-events:none;z-index:1;animation:vortexSpin 20s linear infinite;border-radius:50%; }
    @keyframes vortexSpin { 0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)} }
    .void-bubble { position:fixed;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(100,0,200,0.2),rgba(50,0,150,0.1));animation:voidBubble linear infinite;pointer-events:none;z-index:3;box-shadow:inset 0 0 10px rgba(100,0,200,0.2); }
    @keyframes voidBubble { 0%{transform:translateY(100vh) scale(0.5);opacity:0}20%{opacity:0.6}80%{opacity:0.3}100%{transform:translateY(-50px) scale(1.2);opacity:0} }
    .deep-creature { position:fixed;font-size:26px;opacity:0;animation:deepCreep linear infinite;pointer-events:none;z-index:4; }
    @keyframes deepCreep { 0%{transform:translateY(0) translateX(0);opacity:0}20%{opacity:0.1}50%{transform:translateY(-30vh) translateX(20px)}80%{opacity:0.08}100%{transform:translateY(-60vh) translateX(-10px);opacity:0} }
    .tentacle { position:fixed;font-size:30px;opacity:0.08;pointer-events:none;z-index:3;animation:tentacleWave ease-in-out infinite; }
    @keyframes tentacleWave { 0%,100%{transform:rotate(-15deg) scaleY(1)}50%{transform:rotate(15deg) scaleY(1.05)} }
    .abyss-light { position:fixed;width:4px;height:4px;background:rgba(150,0,255,0.8);border-radius:50%;pointer-events:none;z-index:5;animation:abyssLightPulse ease-in-out infinite;box-shadow:0 0 8px rgba(150,0,255,0.6); }
    @keyframes abyssLightPulse { 0%,100%{opacity:0.1;transform:scale(0.6)}50%{opacity:1;transform:scale(1.8)} }
    .pressure-wave { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,50,0.3) 0%,transparent 60%);animation:pressurePulse 4s ease-in-out infinite; }
    @keyframes pressurePulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.05)} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(0,0,0,0.7) 100%); }
</style>
</head>
<body>
  
  <div class="vortex-aura"></div>
  <div class="pressure-wave"></div>
  <div id="voidBubbleContainer"></div>
  <div id="deepCreatureContainer"></div>
  <div id="tentacleContainer"></div>
  <div id="abyssLightContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🌀 深海漩涡</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🌀</div>
      <div class="monster-name" id="monsterName">漩涡虾</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 深海漩涡任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">征服漩涡: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '漩涡虾', icon: '🦐', level: 3, hp: 130, attack: 24, exp: 50, gold: 20 },
      { id: 2, name: '深海蝙蝠鱼', icon: '🐟', level: 5, hp: 220, attack: 38, exp: 90, gold: 40 },
      { id: 3, name: '剧毒水母', icon: '🪼', level: 7, hp: 380, attack: 58, exp: 155, gold: 72 },
      { id: 4, name: '巨型乌贼', icon: '🦑', level: 10, hp: 650, attack: 88, exp: 260, gold: 125 },
      { id: 5, name: '深海海蛇', icon: '🐍', level: 13, hp: 950, attack: 115, exp: 380, gold: 175 },
      { id: 6, name: '漩涡领主', icon: '🌀', level: 18, hp: 1700, attack: 165, exp: 620, gold: 310 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(API_BASE + '/player/profile', { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = hp + '/' + maxHp;
      document.getElementById('playerHpBar').style.width = (hp / maxHp * 100).toFixed(1) + '%';
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = (exp / maxExp * 100).toFixed(1) + '%';
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(function(m) {
        return '<div class="monster-btn" onclick="selectMonster(' + m.id + ')"><div class="monster-btn-icon">' + m.icon + '</div><div class="monster-btn-name">' + m.name + '</div><div class="monster-btn-level">Lv.' + m.level + '</div></div>';
      }).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(function(m) { return m.id === id; });
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach(function(btn, i) {
        btn.classList.toggle('selected', monsters[i].id === id);
      });
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = 'Lv.' + currentMonster.level;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      var playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      var hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = hpPct + '%';
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      var newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = '+' + currentMonster.exp + ' 经验 +' + currentMonster.gold + ' 金贝';
        setTimeout(function() {
          document.getElementById('resultArea').style.display = 'none';
          document.getElementById('questProgress').style.display = 'none';
          document.querySelectorAll('.monster-btn').forEach(function(btn) { btn.classList.remove('selected'); });
          currentMonster = null;
        }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(function() { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      var pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = pct + '%';
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 深海漩涡任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Abyss atmosphere
    const vbc = document.getElementById('voidBubbleContainer');
    for(let i=0;i<15;i++){const b=document.createElement('div');b.className='void-bubble';const s=Math.random()*30+10;b.style.width=b.style.height=s+'px';b.style.left=Math.random()*100+'%';b.style.animationDuration=(6+Math.random()*6)+'s';b.style.animationDelay=(Math.random()*6)+'s';vbc.appendChild(b);}
    const dcc = document.getElementById('deepCreatureContainer');
    const dcIcons = ['🦑','🐙','🕳️','🦈','🦑','👁️'];
    for(let i=0;i<6;i++){const d=document.createElement('div');d.className='deep-creature';d.textContent=dcIcons[i%dcIcons.length];d.style.left=(10+i*15)+'%';d.style.bottom=(10+Math.random()*20)+'%';d.style.animationDuration=(12+i*3)+'s';d.style.animationDelay=(i*4)+'s';d.style.fontSize=(22+Math.random()*10)+'px';dcc.appendChild(d);}
    const tc = document.getElementById('tentacleContainer');
    ['🐙','🦑','🐙'].forEach((icon,i)=>{const t=document.createElement('div');t.className='tentacle';t.textContent=icon;t.style.left=(8+i*30)+'%';t.style.bottom=(2+i*3)+'%';t.style.fontSize=(28+Math.random()*10)+'px';t.style.animationDuration=(3+Math.random()*2)+'s';t.style.animationDelay=(i*1.5)+'s';tc.appendChild(t);});
    const alc = document.getElementById('abyssLightContainer');
    for(let i=0;i<18;i++){const l=document.createElement('div');l.className='abyss-light';l.style.left=Math.random()*100+'%';l.style.top=Math.random()*80+'%';l.style.animationDuration=(1.5+Math.random()*2.5)+'s';l.style.animationDelay=(Math.random()*4)+'s';alc.appendChild(l);}

</script>
</body>
</html>
