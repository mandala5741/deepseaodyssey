<!-- atmosphere-added: 🧌 巨魔领域 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧌 巨魔领域 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #0a1f0a 0%, #1a3a1a 40%, #0a1f0a 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(10,31,10,0.95); border-bottom: 1px solid rgba(0,255,100,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #32cd32; flex: 1; }
    .back-btn { background: none; border: none; color: #32cd32; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(10,31,10,0.85); border: 2px solid #32cd32; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #32cd32; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: trollGrowl 2s ease-in-out infinite; }
    @keyframes trollGrowl { 0%, 100% { transform: scale(1) rotate(-5deg); } 50% { transform: scale(1.1) rotate(5deg); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #32cd32; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(50,205,50,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #32cd32; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(50,205,50,0.1); border: 1px solid rgba(50,205,50,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(50,205,50,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #32cd32; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(50,205,50,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #32cd32, #228b22); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(50,205,50,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 🧌 巨魔领域 */

    .forest-mist { position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 100%,rgba(0,80,0,0.15) 0%,transparent 60%);pointer-events:none;z-index:1;animation:forestMist 8s ease-in-out infinite; }
    @keyframes forestMist { 0%,100%{opacity:0.5}50%{opacity:0.8} }
    .firefly { position:fixed;width:5px;height:5px;background:radial-gradient(circle,rgba(150,255,50,0.9),rgba(50,200,0,0.3));border-radius:50%;pointer-events:none;z-index:5;animation:fireflyGlow ease-in-out infinite;box-shadow:0 0 8px #80ff20,0 0 15px rgba(100,255,50,0.4); }
    @keyframes fireflyGlow { 0%,100%{opacity:0.2;transform:translate(0,0)}25%{opacity:0.9;transform:translate(10px,-15px)}50%{opacity:0.4;transform:translate(-5px,-25px)}75%{opacity:0.8;transform:translate(8px,-10px)} }
    .mushroom { position:fixed;font-size:24px;opacity:0.12;pointer-events:none;z-index:2;animation:mushroomPulse ease-in-out infinite; }
    @keyframes mushroomPulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }
    .vine { position:fixed;font-size:28px;opacity:0.1;pointer-events:none;z-index:2;animation:vineSway ease-in-out infinite;transform-origin:top center; }
    @keyframes vineSway { 0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)} }
    .mushroom-glow { position:fixed;width:8px;height:8px;background:radial-gradient(circle,rgba(100,255,50,0.7),transparent);border-radius:50%;pointer-events:none;z-index:5;animation:mushroomGlowP ease-in-out infinite;box-shadow:0 0 10px rgba(80,200,0,0.5); }
    @keyframes mushroomGlowP { 0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:0.8;transform:scale(1.3)} }
    .butterfly { position:fixed;font-size:20px;opacity:0.15;pointer-events:none;z-index:4;animation:butterflyFloat ease-in-out infinite; }
    @keyframes butterflyFloat { 0%,100%{transform:translateY(0) translateX(0) rotate(-5deg)}33%{transform:translateY(-20px) translateX(15px) rotate(5deg)}66%{transform:translateY(-10px) translateX(-10px) rotate(-3deg)} }
    .owl { position:fixed;font-size:26px;opacity:0.1;pointer-events:none;z-index:4;animation:owlBob ease-in-out infinite; }
    @keyframes owlBob { 0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)} }
    .frog { position:fixed;font-size:22px;opacity:0.1;pointer-events:none;z-index:4;animation:frogHop ease-in-out infinite; }
    @keyframes frogHop { 0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-12px) scaleX(0.9)} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,20,0,0.5) 100%); }
</style>
</head>
<body>
  
  <div class="forest-mist"></div>
  <div id="fireflyContainer"></div>
  <div id="mushroomContainer"></div>
  <div id="vineContainer"></div>
  <div id="butterflyContainer"></div>
  <div id="owlContainer"></div>
  <div id="frogContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🧌 巨魔领域</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🧌</div>
      <div class="monster-name" id="monsterName">森林哥布林</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 巨魔领域任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">击败森林怪物: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '森林哥布林', icon: '👺', level: 2, hp: 100, attack: 18, exp: 35, gold: 14 },
      { id: 2, name: '巨魔', icon: '🧌', level: 4, hp: 200, attack: 32, exp: 75, gold: 32 },
      { id: 3, name: '树人', icon: '🌲', level: 6, hp: 350, attack: 50, exp: 130, gold: 58 },
      { id: 4, name: '森林巨蟒', icon: '🐍', level: 9, hp: 550, attack: 75, exp: 210, gold: 95 },
      { id: 5, name: '远古巨魔', icon: '🦣', level: 12, hp: 850, attack: 110, exp: 360, gold: 160 },
      { id: 6, name: '森林之王', icon: '👑', level: 17, hp: 1600, attack: 160, exp: 600, gold: 300 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(API_BASE + '/player/profile', { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = hp + '/' + maxHp;
      document.getElementById('playerHpBar').style.width = (hp / maxHp * 100).toFixed(1) + '%';
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = (exp / maxExp * 100).toFixed(1) + '%';
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => '<div class="monster-btn" onclick="selectMonster(' + m.id + ')"><div class="monster-btn-icon">' + m.icon + '</div><div class="monster-btn-name">' + m.name + '</div><div class="monster-btn-level">Lv.' + m.level + '</div></div>').join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = 'Lv.' + currentMonster.level;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = hpPct + '%';
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = '+' + currentMonster.exp + ' 经验 +' + currentMonster.gold + ' 金贝';
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = pct + '%';
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 巨魔领域任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Troll forest atmosphere
    const ffc = document.getElementById('fireflyContainer');
    for(let i=0;i<20;i++){const f=document.createElement('div');f.className='firefly';f.style.left=Math.random()*100+'%';f.style.top=(20+Math.random()*60)+'%';f.style.animationDuration=(3+Math.random()*4)+'s';f.style.animationDelay=(Math.random()*6)+'s';ffc.appendChild(f);}
    const mc = document.getElementById('mushroomContainer');
    ['🍄','🍄','🪵','🍄','🌿'].forEach((icon,i)=>{const m=document.createElement('div');m.className='mushroom';m.textContent=icon;m.style.left=(5+i*18)+'%';m.style.bottom=(2+i*3)+'%';m.style.fontSize=(22+Math.random()*12)+'px';m.style.animationDuration=(2.5+Math.random()*2)+'s';m.style.animationDelay=(i*0.8)+'s';mc.appendChild(m);});
    const vc = document.getElementById('vineContainer');
    ['🌿','🌱','🪴','🌿','🌱'].forEach((icon,i)=>{const v=document.createElement('div');v.className='vine';v.textContent=icon;v.style.left=(8+i*18)+'%';v.style.top=(5+i*2)+'%';v.style.fontSize=(24+Math.random()*10)+'px';v.style.animationDuration=(3+Math.random()*2)+'s';v.style.animationDelay=(i*1.2)+'s';vc.appendChild(v);});
    const bc = document.getElementById('butterflyContainer');
    ['🦋','🦋','🦋','🐛'].forEach((icon,i)=>{const b=document.createElement('div');b.className='butterfly';b.textContent=icon;b.style.left=(10+i*22)+'%';b.style.top=(15+Math.random()*25)+'%';b.style.animationDuration=(6+Math.random()*4)+'s';b.style.animationDelay=(i*2.5)+'s';bc.appendChild(b);});
    const oc = document.getElementById('owlContainer');
    ['🦉','🦉'].forEach((icon,i)=>{const o=document.createElement('div');o.className='owl';o.textContent=icon;o.style.right=(10+i*25)+'%';o.style.top=(10+i*15)+'%';o.style.fontSize=(22+Math.random()*8)+'px';o.style.animationDuration=(4+Math.random()*3)+'s';o.style.animationDelay=(i*3)+'s';oc.appendChild(o);});
    const frc2 = document.getElementById('frogContainer');
    ['🐸','🐸'].forEach((icon,i)=>{const f=document.createElement('div');f.className='frog';f.textContent=icon;f.style.left=(15+i*30)+'%';f.style.bottom=(5+i*4)+'%';f.style.animationDuration=(2.5+Math.random()*2)+'s';f.style.animationDelay=(i*2)+'s';frc2.appendChild(f);});

</script>
</body>
</html>
