<!-- atmosphere-added: 🌋 火山海域 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌋 火山海域 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #1a0500 0%, #8b0000 40%, #1a0500 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(26,5,0,0.95); border-bottom: 1px solid rgba(255,69,0,0.4); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #ff4500; flex: 1; }
    .back-btn { background: none; border: none; color: #ff4500; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(26,5,0,0.85); border: 2px solid #ff4500; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #ff4500; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: shake 0.5s infinite; }
    @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-3px) rotate(-2deg); } 75% { transform: translateX(3px) rotate(2deg); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #ff4500; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(255,69,0,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #ff4500; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(255,69,0,0.1); border: 1px solid rgba(255,69,0,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(255,69,0,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #ff4500; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(255,69,0,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff4500, #ff6347); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(255,69,0,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 🌋 火山海域 */

    .lava-glow { position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,80,0,0.25) 0%,transparent 55%),radial-gradient(ellipse at 20% 100%,rgba(255,30,0,0.15) 0%,transparent 45%),radial-gradient(ellipse at 80% 100%,rgba(255,100,0,0.2) 0%,transparent 50%);pointer-events:none;z-index:1;animation:lavaPulse 3s ease-in-out infinite; }
    @keyframes lavaPulse { 0%,100%{opacity:0.7}50%{opacity:1} }
    .lava-bubble { position:fixed;font-size:20px;opacity:0;animation:lavaBubble linear infinite;pointer-events:none;z-index:3; }
    @keyframes lavaBubble { 0%{transform:translateY(0) scale(0.5);opacity:0}10%{opacity:0.8}80%{opacity:0.4}100%{transform:translateY(-60px) scale(1.2);opacity:0} }
    .ember { position:fixed;width:4px;height:4px;background:#ff6600;border-radius:50%;pointer-events:none;z-index:4;animation:emberFloat linear infinite;box-shadow:0 0 6px #ff4500; }
    @keyframes emberFloat { 0%{transform:translateY(0) translateX(0) scale(1);opacity:1}100%{transform:translateY(-80px) translateX(20px) scale(0);opacity:0} }
    .smoke-puff { position:fixed;font-size:24px;opacity:0;animation:smokePuff linear infinite;pointer-events:none;z-index:2; }
    @keyframes smokePuff { 0%{transform:translateY(0) scale(0.5);opacity:0}15%{opacity:0.3}85%{opacity:0.15}100%{transform:translateY(-100px) scale(1.5);opacity:0} }
    .rock { position:fixed;font-size:18px;opacity:0.12;pointer-events:none;z-index:3;animation:rockSlide ease-in-out infinite; }
    @keyframes rockSlide { 0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-15px) rotate(10deg)} }
    .lava-flow { position:fixed;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,rgba(255,100,0,0.4),rgba(255,50,0,0.6),rgba(255,100,0,0.4),transparent);pointer-events:none;z-index:2;animation:lavaFlow 3s linear infinite; }
    @keyframes lavaFlow { 0%{transform:scaleX(0.3);opacity:0.3}50%{transform:scaleX(0.8);opacity:0.7}100%{transform:scaleX(0.3);opacity:0.3} }
    .heat-wave { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;background:linear-gradient(180deg,rgba(255,100,0,0.03) 0%,transparent 30%);animation:heatWave 2s ease-in-out infinite alternate; }
    @keyframes heatWave { 0%{opacity:0.3}100%{opacity:0.7} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,0.5) 100%); }
</style>
</head>
<body>
  
  <div class="lava-glow"></div>
  <div class="heat-wave"></div>
  <div class="lava-flow"></div>
  <div id="lavaBubbles"></div>
  <div id="emberContainer"></div>
  <div id="smokePuffs"></div>
  <div id="rockContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🌋 火山海域</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🌋</div>
      <div class="monster-name" id="monsterName">岩浆蟹</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 火山海域任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">击败火元素: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '岩浆蟹', icon: '🦀', level: 2, hp: 100, attack: 18, exp: 35, gold: 12 },
      { id: 2, name: '火焰水母', icon: '🪼', level: 4, hp: 180, attack: 30, exp: 70, gold: 28 },
      { id: 3, name: '熔岩蜥蜴', icon: '🦎', level: 6, hp: 300, attack: 48, exp: 120, gold: 55 },
      { id: 4, name: '火山巨龟', icon: '🐢', level: 9, hp: 600, attack: 80, exp: 220, gold: 110 },
      { id: 5, name: '焰龙幼崽', icon: '🐉', level: 12, hp: 1000, attack: 120, exp: 400, gold: 180 },
      { id: 6, name: '火山之神', icon: '🌋', level: 18, hp: 2000, attack: 180, exp: 700, gold: 350 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => `<div class="monster-btn" onclick="selectMonster(${m.id})"><div class="monster-btn-icon">${m.icon}</div><div class="monster-btn-name">${m.name}</div><div class="monster-btn-level">Lv.${m.level}</div></div>`).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 火山海域任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Volcano atmosphere
    const lb = document.getElementById('lavaBubbles');
    const lavaIcons = ['💥','🔥','🌋','💥','🔥'];
    for(let i=0;i<6;i++){const b=document.createElement('div');b.className='lava-bubble';b.textContent=lavaIcons[i%lavaIcons.length];b.style.left=(5+i*16)+'%';b.style.bottom=(5+Math.random()*15)+'%';b.style.animationDuration=(2+Math.random()*2)+'s';b.style.animationDelay=(i*1.5)+'s';lb.appendChild(b);}
    const ec = document.getElementById('emberContainer');
    for(let i=0;i<20;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'%';e.style.bottom=(Math.random()*30)+'%';e.style.animationDuration=(1.5+Math.random()*2)+'s';e.style.animationDelay=(Math.random()*4)+'s';ec.appendChild(e);}
    const sp = document.getElementById('smokePuffs');
    ['☁️','🌫️','💨','☁️'].forEach((icon,i)=>{const s=document.createElement('div');s.className='smoke-puff';s.textContent=icon;s.style.left=(8+i*22)+'%';s.style.bottom=(10+i*3)+'%';s.style.animationDuration=(4+Math.random()*3)+'s';s.style.animationDelay=(i*2)+'s';sp.appendChild(s);});
    const rc = document.getElementById('rockContainer');
    ['🪨','🪨','🪨'].forEach((icon,i)=>{const r=document.createElement('div');r.className='rock';r.textContent=icon;r.style.left=(10+i*28)+'%';r.style.bottom=(5+i*4)+'%';r.style.animationDuration=(3+Math.random()*2)+'s';r.style.animationDelay=(i*1.5)+'s';rc.appendChild(r);});

</script>
</body>
</html>
