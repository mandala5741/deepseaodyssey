<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ PVP - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { 
      padding-top: 0; 
      background: linear-gradient(180deg, #1a0a0a 0%, #3d1515 30%, #2a1010 60%, #1a0a0a 100%);
      min-height: 100vh;
    }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(40,15,15,0.95); border-bottom: 1px solid rgba(255,100,100,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #ff6b6b; flex: 1; }
    .back-btn { background: none; border: none; color: #ff6b6b; font-size: 20px; cursor: pointer; padding: 8px; }
    
    /* Fire particles */
    .fire-particles {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .fire-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: fireRise 4s ease-out infinite;
    }
    @keyframes fireRise {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-50px) scale(0); opacity: 0; }
    }
    
    .content { 
      margin-top: 60px; 
      padding: 12px; 
      position: relative;
      z-index: 10;
    }
    
    .info-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .info-title { font-size: 16px; color: #ff6b6b; margin-bottom: 8px; }
    .info-desc { font-size: 12px; color: rgba(255,150,150,0.7); }
    .info-cost { font-size: 12px; color: #ffd700; margin-top: 6px; }
    
    .my-status {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .my-avatar { font-size: 40px; }
    .my-info { flex: 1; }
    .my-name { font-size: 16px; color: #ff6b6b; margin-bottom: 4px; }
    .my-stats { font-size: 12px; color: rgba(255,150,150,0.7); }
    .my-record {
      text-align: center;
      padding: 8px 16px;
      background: rgba(255,100,100,0.2);
      border-radius: 10px;
    }
    .record-num { font-size: 20px; color: #ffd700; }
    .record-label { font-size: 10px; color: rgba(255,150,150,0.6); }
    
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .section-icon { font-size: 20px; }
    .section-label { font-size: 14px; color: #ff6b6b; font-weight: bold; }
    
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .player-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }
    .player-card:hover {
      transform: translateX(4px);
      border-color: rgba(255,100,100,0.6);
      box-shadow: 0 4px 15px rgba(255,50,50,0.2);
    }
    
    .player-rank {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,100,100,0.2);
      border-radius: 50%;
      font-size: 14px;
      color: #ff6b6b;
    }
    .player-rank.top3 {
      background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,100,0,0.3));
      color: #ffd700;
    }
    
    .player-avatar { font-size: 36px; }
    
    .player-info { flex: 1; }
    .player-name { font-size: 14px; color: #fff; margin-bottom: 4px; }
    .player-power { font-size: 12px; color: rgba(255,150,150,0.7); }
    .player-power span { color: #ffd700; }
    
    .challenge-btn {
      padding: 10px 18px;
      background: linear-gradient(135deg, rgba(255,100,100,0.5), rgba(200,50,50,0.5));
      border: 1px solid rgba(255,100,100,0.6);
      border-radius: 10px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .challenge-btn:hover {
      background: linear-gradient(135deg, rgba(255,100,100,0.7), rgba(200,50,50,0.7));
      transform: scale(1.05);
    }
    .challenge-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    /* Battle Modal */
    .battle-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      padding: 20px;
    }
    .battle-overlay.show { display: flex; }
    
    .battle-arena {
      background: linear-gradient(180deg, #3d1515 0%, #1a0a0a 100%);
      border: 3px solid rgba(255,100,100,0.5);
      border-radius: 20px;
      padding: 30px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .battle-title { font-size: 18px; color: #ff6b6b; margin-bottom: 20px; }
    
    .battle-fighters {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }
    .fighter {
      text-align: center;
    }
    .fighter-avatar { font-size: 50px; margin-bottom: 8px; }
    .fighter-name { font-size: 14px; color: #fff; }
    .fighter-power { font-size: 11px; color: rgba(255,150,150,0.7); }
    .fighter-power span { color: #ffd700; }
    .vs { font-size: 24px; color: #ffd700; font-weight: bold; }
    
    .battle-compare {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .compare-item { text-align: center; }
    .compare-label { color: rgba(255,150,150,0.6); margin-bottom: 2px; }
    .compare-value { color: #fff; }
    
    .battle-log {
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      text-align: left;
    }
    .log-entry { margin-bottom: 4px; }
    .log-entry.win { color: #00c864; }
    .log-entry.lose { color: #ff5050; }
    
    .battle-result {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .result-rewards { font-size: 14px; color: #ffd700; }
    
    .close-btn {
      margin-top: 16px;
      padding: 12px 30px;
      background: rgba(255,100,100,0.3);
      border: 1px solid rgba(255,100,100,0.5);
      border-radius: 10px;
      color: #ff6b6b;
      font-size: 14px;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(255,100,100,0.5); }
  </style>
</head>
<body>
  <div class="fire-particles" id="fireParticles"></div>
  
  <div class="header">
    <button class="back-btn" onclick="location.href='/main.html'">←</button>
    <h1>⚔️ PVP挑战</h1>
  </div>

  <div class="content">
    <div class="info-card">
      <div class="info-title">🔥 挑战其他玩家</div>
      <div class="info-desc">击败对手获得金贝和经验，失败有失败邮件</div>
      <div class="info-cost">⚡ 每次挑战消耗10点体力</div>
    </div>
    
    <div class="my-status" id="myStatus">
      <div class="my-avatar">🦞</div>
      <div class="my-info">
        <div class="my-name" id="myName">加载中...</div>
        <div class="my-stats">战力: <span id="myPower">0</span> | 体力: <span id="myEnergy">0</span>/<span id="myMaxEnergy">0</span></div>
      </div>
      <div class="my-record">
        <div class="record-num" id="myWins">0</div>
        <div class="record-label">胜</div>
      </div>
      <div class="my-record">
        <div class="record-num" id="myLosses">0</div>
        <div class="record-label">负</div>
      </div>
    </div>
    
    <div class="section-title">
      <span class="section-icon">🎯</span>
      <span class="section-label">可挑战对手</span>
    </div>
    
    <div class="players-list" id="playersList">
      <div style="text-align:center;color:#ff6b6b;padding:20px">加载中...</div>
    </div>
  </div>
  
  <!-- Battle Modal -->
  <div class="battle-overlay" id="battleOverlay">
    <div class="battle-arena">
      <div class="battle-title" id="battleTitle">⚔️ 挑战中</div>
      
      <div class="battle-fighters">
        <div class="fighter">
          <div class="fighter-avatar">🦞</div>
          <div class="fighter-name" id="attackerName">我</div>
          <div class="fighter-power">战力: <span id="attackerPower">0</span></div>
        </div>
        <div class="vs">VS</div>
        <div class="fighter">
          <div class="fighter-avatar">🦞</div>
          <div class="fighter-name" id="defenderName">对手</div>
          <div class="fighter-power">战力: <span id="defenderPower">0</span></div>
        </div>
      </div>
      
      <div class="battle-compare">
        <div class="compare-item">
          <div class="compare-label">我的战力</div>
          <div class="compare-value" id="compareMyPower">0</div>
        </div>
        <div class="compare-item">
          <div class="compare-label">对手战力</div>
          <div class="compare-value" id="compareTargetPower">0</div>
        </div>
      </div>
      
      <div class="battle-log" id="battleLog"></div>
      
      <div class="battle-result" id="battleResult"></div>
      <div class="result-rewards" id="resultRewards"></div>
      
      <button class="close-btn" onclick="closeBattle()">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    let myPlayerId = null;
    let challengers = [];
    
    // Create fire particles
    const particlesContainer = document.getElementById('fireParticles');
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'fire-particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 4 + 's';
      particlesContainer.appendChild(particle);
    }
    
    async function loadMyProfile() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) {
          myPlayerId = data.player.player_id || data.player.id;
          document.getElementById('myName').textContent = data.player.name || '我';
          document.getElementById('myPower').textContent = data.player.power || 0;
          document.getElementById('myEnergy').textContent = data.player.energy || 0;
          document.getElementById('myMaxEnergy').textContent = data.player.max_energy || 100;
          const wins = Math.max(0, data.player.wins || data.player.win || 0);
          const losses = Math.max(0, data.player.losses || data.player.lose || 0);
          document.getElementById('myWins').textContent = wins;
          document.getElementById('myLosses').textContent = losses;
        }
      } catch (e) {}
    }
    
    async function loadChallengers() {
      try {
        const res = await fetch(`${API_BASE}/leaderboard/power`, { headers: getAuthHeader() });
        const data = await res.json();
        const players = data.rankings || data.players || data.data?.players || [];
        
        // Filter out myself and system user (id > 0, not my player_id)
        challengers = players.filter(p => {
          const pid = p.id || p.player_id;
          return pid > 0 && String(pid) !== String(myPlayerId);
        }).slice(0, 10);
        
        if (!challengers.length) {
          document.getElementById('playersList').innerHTML = '<div style="text-align:center;color:#ff6b6b;padding:20px">暂无可挑战对手</div>';
          return;
        }
        
        document.getElementById('playersList').innerHTML = challengers.map((p, i) => {
          const pid = p.id || p.player_id;
          return `
            <div class="player-card">
              <div class="player-rank ${i < 3 ? 'top3' : ''}">${i + 1}</div>
              <div class="player-avatar">🦞</div>
              <div class="player-info">
                <div class="player-name">${p.name}</div>
                <div class="player-power">战力: <span>${p.power || 0}</span></div>
              </div>
              <button class="challenge-btn" onclick="challenge(${pid}, '${p.name}', ${p.power || 0})">挑战</button>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('playersList').innerHTML = '<div style="text-align:center;color:#ff5050;padding:20px">加载失败</div>';
      }
    }
    
    async function challenge(targetId, targetName, targetPower) {
      const myPower = parseInt(document.getElementById('myPower').textContent) || 0;
      const myEnergy = parseInt(document.getElementById('myEnergy').textContent) || 0;
      
      if (myEnergy < 10) {
        showToast('⚡ 体力不足！', 'error');
        return;
      }
      
      // Show battle modal
      document.getElementById('attackerName').textContent = document.getElementById('myName').textContent;
      document.getElementById('attackerPower').textContent = myPower;
      document.getElementById('defenderName').textContent = targetName;
      document.getElementById('defenderPower').textContent = targetPower;
      document.getElementById('compareMyPower').textContent = myPower;
      document.getElementById('compareTargetPower').textContent = targetPower;
      document.getElementById('battleLog').innerHTML = '';
      document.getElementById('battleResult').textContent = '';
      document.getElementById('resultRewards').textContent = '';
      document.getElementById('battleOverlay').classList.add('show');
      
      // Do PVP challenge
      await doPVPChallenge(targetId, targetName);
    }
    
    async function doPVPChallenge(targetAgentId, targetName) {
      const log = document.getElementById('battleLog');
      const addLog = (msg, type = '') => {
        log.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
      };
      
      addLog('⚔️ 战斗开始！');
      
      try {
        const res = await fetch(`${API_BASE}/pvp/challenge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
          body: JSON.stringify({ target_agent_id: targetAgentId })
        });
        const data = await res.json();
        
        await new Promise(r => setTimeout(r, 300));
        
        if (data.success || data.code === 0) {
          const myPower = data.attacker_power || parseInt(document.getElementById('myPower').textContent) || 0;
          const enemyPower = data.defender_power || 0;
          
          addLog(`⚔️ 对手战力: ${enemyPower}`);
          await new Promise(r => setTimeout(r, 300));
          addLog(`⚔️ 你的战力: ${myPower}`);
          await new Promise(r => setTimeout(r, 300));
          
          if (data.won) {
            addLog('🏆 胜利！', 'win');
            document.getElementById('battleResult').textContent = '🏆 胜利！';
            document.getElementById('resultRewards').textContent = `+${data.gold_change || 100} 金贝 +${data.xp_change || 50} 经验`;
            const newWins = parseInt(document.getElementById('myWins').textContent) || 0;
            document.getElementById('myWins').textContent = newWins + 1;
          } else {
            addLog('💀 挑战失败...', 'lose');
            document.getElementById('battleResult').textContent = '💀 挑战失败';
            document.getElementById('resultRewards').textContent = '已收到失败邮件';
            const newLosses = parseInt(document.getElementById('myLosses').textContent) || 0;
            document.getElementById('myLosses').textContent = newLosses + 1;
            document.getElementById('myEnergy').textContent = parseInt(document.getElementById('myEnergy').textContent) - 10;
          }
        } else {
          addLog('⚠️ ' + (data.message || '挑战失败'));
          document.getElementById('battleResult').textContent = '⚠️ 挑战失败';
          document.getElementById('resultRewards').textContent = data.message || '';
        }
      } catch (e) {
        addLog('❌ 网络错误');
        document.getElementById('battleResult').textContent = '❌ 网络错误';
      }
    }
    
    function closeBattle() {
      document.getElementById('battleOverlay').classList.remove('show');
      loadChallengers(); // Refresh list
    }
    
    // Initialize
    loadMyProfile().then(() => loadChallengers());
  </script>
</body>
</html>
