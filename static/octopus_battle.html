<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐙 章鱼大作战 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 60px; background: linear-gradient(180deg, #100030 0%, #300060 50%, #100020 100%); min-height: 100vh; font-family: -apple-system, sans-serif; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(20,0,40,0.95); border-bottom: 1px solid rgba(180,0,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #c060ff; flex: 1; }
    .back-btn { background: none; border: none; color: #c060ff; font-size: 20px; cursor: pointer; }
    .content { padding: 16px; text-align: center; color: #fff; }
    .icon { font-size: 80px; margin: 40px 0 20px; }
    h2 { color: #c060ff; margin-bottom: 16px; }
    .desc { color: rgba(255,255,255,0.7); line-height: 1.8; max-width: 400px; margin: 0 auto 30px; }
    .feature { background: rgba(40,0,70,0.5); border: 1px solid rgba(180,0,255,0.3); border-radius: 12px; padding: 16px; margin: 12px auto; max-width: 400px; text-align: left; }
    .feature-title { color: #c060ff; font-weight: bold; margin-bottom: 8px; }
    .feature-desc { color: rgba(255,255,255,0.6); font-size: 14px; }
    .soon { background: rgba(255,150,0,0.2); border: 1px solid rgba(255,150,0,0.5); color: #ffa500; border-radius: 12px; padding: 14px; max-width: 400px; margin: 20px auto; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🐙 章鱼大作战</h1>
  </div>
  <div class="content">
    <div class="icon">🐙</div>
    <h2>章鱼大作战：色彩与伪装</h2>
    <p class="desc">玩家扮演一只拟态章鱼，核心机制是伪装与解谜。每关都需要变成特定物体的形态来骗过敌人或开启机关。</p>

    <div class="feature">
      <div class="feature-title">🔄 形态切换</div>
      <div class="feature-desc">触摸"石头印记"就能变成石头，用来躲避鲨鱼；触摸"狮子鱼印记"可以竖起毒刺，吓退小型猎食者。</div>
    </div>

    <div class="feature">
      <div class="feature-title">💨 喷射潜行</div>
      <div class="feature-desc">章鱼可以利用喷水推进来穿过狭窄的洞穴，甚至喷出水柱推动远处的机关或果实。</div>
    </div>

    <div class="feature">
      <div class="feature-title">🎨 拟态大师</div>
      <div class="feature-desc">根据当前巡视的掠食者（如海鳗、海鸟）的视觉特点，快速切换对应的伪装形态。收集反光贝壳解锁皮肤！</div>
    </div>

    <div class="soon">🚧 游戏开发中，敬请期待...</div>
  </div>
</body>
</html>
