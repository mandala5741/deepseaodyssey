<!-- atmosphere-added: ❄️ 雪原商路 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>❄️ 雪原商路 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #e8f4f8 0%, #b8d4e8 40%, #87ceeb 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(200,220,240,0.95); border-bottom: 1px solid rgba(100,150,200,0.4); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #4682b4; flex: 1; }
    .back-btn { background: none; border: none; color: #4682b4; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(255,255,255,0.9); border: 2px solid #4682b4; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #4682b4; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.1); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: tradeFloat 3s ease-in-out infinite; }
    @keyframes tradeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.1); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #4682b4; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(70,130,180,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #4682b4; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(70,130,180,0.1); border: 1px solid rgba(70,130,180,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(70,130,180,0.2); }
    .monster-btn.selected { border-color: #f59f00; background: rgba(255,212,59,0.2); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #4682b4; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(70,130,180,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #4682b4, #87ceeb); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(70,130,180,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #f59f00; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(245,159,0,0.8); }
  
    /* Atmosphere: ❄️ 雪原商路 */

    .sky-glow { position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(180,210,230,0.15) 0%,rgba(150,190,220,0.1) 50%,rgba(200,220,240,0.08) 100%);pointer-events:none;z-index:1; }
    .snow-particle { position:fixed;color:rgba(255,255,255,0.8);pointer-events:none;z-index:3;animation:snowFall linear infinite; }
    @keyframes snowFall { 0%{transform:translateY(-20px) translateX(0) rotate(0deg);opacity:0}10%{opacity:0.9}50%{transform:translateY(50vh) translateX(20px) rotate(180deg)}90%{opacity:0.5}100%{transform:translateY(100vh) translateX(-10px) rotate(360deg);opacity:0} }
    .sleigh { position:fixed;font-size:32px;opacity:0.15;pointer-events:none;z-index:3;animation:sleighRide linear infinite;bottom:25%; }
    @keyframes sleighRide { 0%{transform:translateX(-100px)}100%{transform:translateX(calc(100vw + 100px))} }
    .pine-tree { position:fixed;font-size:36px;opacity:0.12;pointer-events:none;z-index:2;animation:pineSway ease-in-out infinite; }
    @keyframes pineSway { 0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)} }
    .gift { position:fixed;font-size:22px;opacity:0.1;pointer-events:none;z-index:3;animation:giftBob ease-in-out infinite; }
    @keyframes giftBob { 0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)} }
    .reindeer { position:fixed;font-size:26px;opacity:0.1;pointer-events:none;z-index:3;animation:reindeerRun linear infinite;bottom:18%; }
    @keyframes reindeerRun { 0%{transform:translateX(-80px)}100%{transform:translateX(calc(100vw + 80px))} }
    .carrot { position:fixed;font-size:18px;opacity:0.1;pointer-events:none;z-index:3;animation:carrotBob ease-in-out infinite; }
    @keyframes carrotBob { 0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)} }
    .snow-ground { position:fixed;bottom:0;left:0;right:0;height:12%;background:linear-gradient(180deg,transparent,rgba(220,240,255,0.12) 50%,rgba(200,230,255,0.2));pointer-events:none;z-index:2; }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(100,140,180,0.3) 100%); }
</style>
</head>
<body>
  
  <div class="sky-glow"></div>
  <div class="snow-ground"></div>
  <div id="snowParticles"></div>
  <div id="sleighContainer"></div>
  <div id="pineContainer"></div>
  <div id="giftContainer"></div>
  <div id="reindeerContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>❄️ 雪原商路</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🛷</div>
      <div class="monster-name" id="monsterName">雪地毛贼</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 雪原商路任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">击败劫匪: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '雪地毛贼', icon: '🐭', level: 1, hp: 70, attack: 10, exp: 20, gold: 8 },
      { id: 2, name: '冰霜狼', icon: '🐺', level: 3, hp: 130, attack: 22, exp: 48, gold: 20 },
      { id: 3, name: '雪猿', icon: '🦍', level: 5, hp: 220, attack: 38, exp: 85, gold: 40 },
      { id: 4, name: '极地商人', icon: '🧔', level: 7, hp: 320, attack: 52, exp: 130, gold: 65 },
      { id: 5, name: '雪魔王', icon: '❄️', level: 11, hp: 650, attack: 90, exp: 280, gold: 130 },
      { id: 6, name: '凛冬守卫', icon: '⛄', level: 16, hp: 1200, attack: 140, exp: 500, gold: 250 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => `<div class="monster-btn" onclick="selectMonster(${m.id})"><div class="monster-btn-icon">${m.icon}</div><div class="monster-btn-name">${m.name}</div><div class="monster-btn-level">Lv.${m.level}</div></div>`).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 雪原商路任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Snow atmosphere
    const sp = document.getElementById('snowParticles');
    for(let i=0;i<35;i++){const s=document.createElement('div');s.className='snow-particle';s.textContent=['❄','❅','❆','✦','❇'][i%5];s.style.left=Math.random()*100+'%';s.style.fontSize=(Math.random()*16+8)+'px';s.style.animationDuration=(Math.random()*10+7)+'s';s.style.animationDelay=(Math.random()*8)+'s';sp.appendChild(s);}
    const sleighC = document.getElementById('sleighContainer');
    ['🛷','🎁','🛷'].forEach((icon,i)=>{const s=document.createElement('div');s.className='sleigh';s.textContent=icon;s.style.animationDuration=(40+i*15)+'s';s.style.animationDelay=(i*18)+'s';s.style.fontSize=(26+i*4)+'px';sleighC.appendChild(s);});
    const pineC = document.getElementById('pineContainer');
    ['🌲','🎄','🌲','🎅','🌲'].forEach((icon,i)=>{const p=document.createElement('div');p.className='pine-tree';p.textContent=icon;p.style.left=(3+i*19)+'%';p.style.bottom=(2+i*2)+'%';p.style.fontSize=(30+Math.random()*16)+'px';p.style.animationDuration=(3+Math.random()*2)+'s';p.style.animationDelay=(i*0.6)+'s';pineC.appendChild(p);});
    const gc = document.getElementById('giftContainer');
    ['🎁','🎀','🎁'].forEach((icon,i)=>{const g=document.createElement('div');g.className='gift';g.textContent=icon;g.style.left=(10+i*28)+'%';g.style.bottom=(8+i*4)+'%';g.style.animationDuration=(2.5+Math.random()*2)+'s';g.style.animationDelay=(i*1.5)+'s';gc.appendChild(g);});
    const rc = document.getElementById('reindeerContainer');
    ['🦌','🦌'].forEach((icon,i)=>{const r=document.createElement('div');r.className='reindeer';r.textContent=icon;r.style.animationDuration=(50+i*20)+'s';r.style.animationDelay=(i*25)+'s';rc.appendChild(r);});

</script>
</body>
</html>
