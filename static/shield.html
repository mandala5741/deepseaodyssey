<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🛡️ 保护盾 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { 
      padding-top: 0; 
      background: linear-gradient(180deg, #0a1a2e 0%, #1a3a5e 30%, #0a2a4a 60%, #051525 100%);
      min-height: 100vh;
    }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,50,80,0.95); border-bottom: 1px solid rgba(0,212,170,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #00d4aa; flex: 1; }
    .back-btn { background: none; border: none; color: #00d4aa; font-size: 20px; cursor: pointer; padding: 8px; }
    
    /* Shield glow effect */
    .shield-glow {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,212,170,0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    
    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(0,212,170,0.6);
      border-radius: 50%;
      animation: floatParticle 6s ease-in-out infinite;
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-50px) scale(1); opacity: 0; }
    }
    
    .content { 
      margin-top: 60px; 
      padding: 12px; 
      position: relative;
      z-index: 10;
    }
    
    .shield-card {
      background: rgba(0,40,70,0.85);
      border: 2px solid rgba(0,212,170,0.4);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .shield-icon {
      font-size: 80px;
      margin-bottom: 16px;
      animation: shieldPulse 2s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.2); }
    }
    
    .shield-time {
      font-size: 32px;
      color: #00d4aa;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .shield-desc {
      font-size: 14px;
      color: rgba(200,230,255,0.7);
      margin-bottom: 8px;
    }
    .shield-status {
      display: inline-block;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 8px;
    }
    .shield-status.active {
      background: rgba(0,212,170,0.2);
      color: #00d4aa;
    }
    .shield-status.inactive {
      background: rgba(255,100,100,0.2);
      color: #ff6b6b;
    }
    
    .options-title {
      font-size: 14px;
      color: #00d4aa;
      margin-bottom: 12px;
      text-align: center;
    }
    
    .shield-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    
    .shield-btn {
      padding: 16px 12px;
      background: rgba(0,40,70,0.8);
      border: 2px solid rgba(0,212,170,0.3);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .shield-btn:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,170,0.6);
      box-shadow: 0 8px 25px rgba(0,212,170,0.2);
    }
    .shield-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .shield-btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }
    
    .btn-icon { font-size: 28px; margin-bottom: 6px; }
    .btn-duration { font-size: 16px; color: #fff; margin-bottom: 4px; }
    .btn-price { font-size: 12px; color: #ffd700; }
    
    .cancel-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,80,80,0.15);
      border: 2px solid rgba(255,80,100,0.4);
      border-radius: 14px;
      color: #ff6b6b;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s;
    }
    .cancel-btn:hover {
      background: rgba(255,80,80,0.25);
    }
    
    .info-card {
      background: rgba(0,40,70,0.85);
      border: 2px solid rgba(0,212,170,0.4);
      border-radius: 16px;
      padding: 16px;
    }
    .info-title { font-size: 14px; color: #00d4aa; margin-bottom: 10px; }
    .info-row { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid rgba(0,212,170,0.1);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: rgba(200,230,255,0.6); }
    .info-value { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="shield-glow"></div>
  <div class="particles" id="particles"></div>
  
  <div class="header">
    <button class="back-btn" onclick="location.href='/main.html'">←</button>
    <h1>🛡️ 保护盾</h1>
  </div>

  <div class="content">
    <div class="shield-card">
      <div class="shield-icon" id="shieldIcon">🛡️</div>
      <div class="shield-time" id="shieldTime">--</div>
      <div class="shield-desc" id="shieldDesc">保护盾未激活</div>
      <div class="shield-status inactive" id="shieldStatus">未激活</div>
    </div>
    
    <div class="options-title">⏰ 选择保护时长</div>
    
    <div class="shield-options">
      <button class="shield-btn" onclick="activateShield('silver_2h')">
        <div class="btn-icon">⏰</div>
        <div class="btn-duration">+2小时</div>
        <div class="btn-price">💰 50 银贝</div>
      </button>
      <button class="shield-btn" onclick="activateShield('silver_5h')">
        <div class="btn-icon">🛡️</div>
        <div class="btn-duration">+5小时</div>
        <div class="btn-price">💰 100 银贝</div>
      </button>
      <button class="shield-btn" onclick="activateShield('silver_8h')">
        <div class="btn-icon">⏱️</div>
        <div class="btn-duration">+8小时</div>
        <div class="btn-price">💰 300 银贝</div>
      </button>
      <button class="shield-btn" onclick="activateShield('gold_24h')">
        <div class="btn-icon">💎</div>
        <div class="btn-duration">+24小时</div>
        <div class="btn-price">💰 1200 金贝</div>
      </button>
    </div>
    
    <button class="cancel-btn" id="cancelBtn" onclick="cancelShield()" style="display:none">
      🚪 取消保护盾
    </button>
    
    <div class="info-card" style="margin-top:16px">
      <div class="info-title">📋 保护盾说明</div>
      <div class="info-row">
        <span class="info-label">新手保护</span>
        <span class="info-value">注册送5天</span>
      </div>
      <div class="info-row">
        <span class="info-label">保护效果</span>
        <span class="info-value">挑战时无敌</span>
      </div>
      <div class="info-row">
        <span class="info-label">取消冷却</span>
        <span class="info-value">30分钟</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    // Create particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 5 + 4) + 's';
      particle.style.animationDelay = (Math.random() * 4) + 's';
      particlesContainer.appendChild(particle);
    }
    
    async function loadShield() {
      try {
        const res = await fetch(`${API_BASE}/shield/status`, { headers: getAuthHeader() });
        const data = await res.json();
        const icon = document.getElementById('shieldIcon');
        const time = document.getElementById('shieldTime');
        const desc = document.getElementById('shieldDesc');
        const status = document.getElementById('shieldStatus');
        const cancelBtn = document.getElementById('cancelBtn');
        
        if (data.active) {
          icon.textContent = '🛡️';
          icon.style.animation = 'shieldPulse 2s ease-in-out infinite';
          time.textContent = formatTime(data.remaining_seconds);
          desc.textContent = data.is_newbie ? '新手保护盾' : '保护盾激活中';
          status.textContent = '激活中';
          status.className = 'shield-status active';
          cancelBtn.style.display = 'block';
        } else if (data.cooldown_seconds > 0) {
          icon.textContent = '⏰';
          icon.style.animation = 'none';
          time.textContent = formatTime(data.cooldown_seconds);
          desc.textContent = '取消冷却中';
          status.textContent = '冷却中';
          status.className = 'shield-status inactive';
          cancelBtn.style.display = 'none';
        } else {
          icon.textContent = '🛡️';
          icon.style.animation = 'none';
          time.textContent = '未激活';
          desc.textContent = '点击下方按钮激活保护盾';
          status.textContent = '未激活';
          status.className = 'shield-status inactive';
          cancelBtn.style.display = 'none';
        }
      } catch (e) { showToast('加载失败', 'error'); }
    }

    async function activateShield(type) {
      try {
        const res = await fetch(`${API_BASE}/shield/activate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
          body: JSON.stringify({ shield_type: type })
        });
        const data = await res.json();
        if (data.success || data.code === 0) {
          showToast('🛡️ 保护盾激活成功！');
          loadShield();
        } else {
          showToast(data.message || '激活失败', 'error');
        }
      } catch (e) { showToast('网络错误', 'error'); }
    }

    async function cancelShield() {
      if (!confirm('确定要取消保护盾吗？取消后需等待30分钟才能再次激活。')) return;
      try {
        const res = await fetch(`${API_BASE}/shield/deactivate`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeader() } });
        const data = await res.json();
        if (data.success || data.code === 0) {
          showToast('保护盾已取消');
          loadShield();
        } else {
          showToast(data.message || '取消失败', 'error');
        }
      } catch (e) { showToast('网络错误', 'error'); }
    }

    loadShield();
  </script>
</body>
</html>
