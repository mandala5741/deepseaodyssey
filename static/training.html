<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏋️ 修炼场 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { 
      padding-top: 0; 
      background: linear-gradient(180deg, #1a0a0a 0%, #3d1a1a 30%, #2a1515 60%, #1a0a0a 100%);
      min-height: 100vh;
    }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(60,20,20,0.95); border-bottom: 1px solid rgba(255,100,100,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #ff6b6b; flex: 1; }
    .back-btn { background: none; border: none; color: #ff6b6b; font-size: 20px; cursor: pointer; padding: 8px; }
    
    /* Fire glow effect */
    .fire-glow {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,100,50,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    
    /* Sparks */
    .sparks {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: sparkRise 3s ease-out infinite;
    }
    @keyframes sparkRise {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-50px) scale(0); opacity: 0; }
    }
    
    .content { 
      margin-top: 60px; 
      padding: 12px; 
      position: relative;
      z-index: 10;
    }
    
    .energy-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .energy-display {
      text-align: center;
      padding: 16px 0;
    }
    .energy-icon { font-size: 36px; margin-bottom: 8px; }
    .energy-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; margin: 8px 20px; }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ff4444); border-radius: 8px; transition: width 0.3s; }
    .energy-text { font-size: 16px; color: #ff6b6b; margin-top: 6px; }
    
    .training-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .training-item {
      background: rgba(255,100,100,0.1);
      border: 2px solid rgba(255,100,100,0.3);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .training-item:hover { background: rgba(255,100,100,0.2); transform: scale(1.02); }
    .training-item.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); }
    .training-item.disabled { opacity: 0.4; cursor: not-allowed; }
    .training-icon { font-size: 32px; margin-bottom: 6px; }
    .training-name { font-size: 13px; color: #ff6b6b; margin-bottom: 4px; }
    .training-cost { font-size: 11px; color: rgba(255,150,150,0.7); margin-bottom: 4px; }
    .training-gain { font-size: 10px; color: #ffd700; }
    
    .start-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, rgba(255,100,100,0.5), rgba(200,50,50,0.5));
      border: 2px solid rgba(255,100,100,0.6);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s;
    }
    .start-btn:hover { background: linear-gradient(135deg, rgba(255,100,100,0.7), rgba(200,50,50,0.7)); }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .progress-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .progress-title { font-size: 14px; color: #ff6b6b; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .progress-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd700); transition: width 0.3s; }
    .progress-text { font-size: 11px; color: rgba(255,150,150,0.6); }
    
    .attributes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .attr-item {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .attr-icon { font-size: 22px; margin-bottom: 4px; }
    .attr-name { font-size: 10px; color: rgba(255,150,150,0.6); }
    .attr-value { font-size: 14px; color: #ff6b6b; font-weight: bold; }
    
    .result-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,215,0,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
      display: none;
    }
    .result-card.show { display: block; }
    .result-icon { font-size: 48px; margin-bottom: 10px; }
    .result-title { font-size: 18px; color: #ffd700; margin-bottom: 8px; }
    .result-rewards { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
    .reward { text-align: center; }
    .reward-icon { font-size: 24px; }
    .reward-value { font-size: 14px; color: #ffd700; }
    .reward-label { font-size: 10px; color: rgba(255,215,0,0.6); }
    
    .stat-card {
      background: rgba(60,20,20,0.85);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .stat-title { font-size: 14px; color: #ff6b6b; margin-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,100,100,0.1); }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 12px; color: rgba(255,150,150,0.7); }
    .stat-value { font-size: 12px; color: #ff6b6b; }
    
    .training-animation {
      font-size: 60px;
      animation: trainPulse 0.5s ease-in-out infinite;
      display: none;
    }
    .training-animation.active { display: block; }
    @keyframes trainPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="fire-glow"></div>
  <div class="sparks" id="sparks"></div>
  
  <div class="header">
    <button class="back-btn" onclick="location.href='/main.html'">←</button>
    <h1>🏋️ 修炼场</h1>
  </div>

  <div class="content">
    <div class="energy-card">
      <div class="energy-display">
        <div class="energy-icon">⚡</div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width:70%"></div></div>
        <div class="energy-text">体力: <span id="currentEnergy">70</span> / <span id="maxEnergy">100</span></div>
      </div>
    </div>
    
    <div class="training-grid">
      <div class="training-item" id="train1" onclick="selectTraining(1)">
        <div class="training-icon">💪</div>
        <div class="training-name">基础体能</div>
        <div class="training-cost">⚡ 20 体力</div>
        <div class="training-gain">+5 力量经验</div>
      </div>
      <div class="training-item" id="train2" onclick="selectTraining(2)">
        <div class="training-icon">🏃</div>
        <div class="training-name">速度训练</div>
        <div class="training-cost">⚡ 15 体力</div>
        <div class="training-gain">+5 敏捷经验</div>
      </div>
      <div class="training-item" id="train3" onclick="selectTraining(3)">
        <div class="training-icon">⚔️</div>
        <div class="training-name">战斗技巧</div>
        <div class="training-cost">⚡ 30 体力</div>
        <div class="training-gain">+8 战斗经验</div>
      </div>
      <div class="training-item" id="train4" onclick="selectTraining(4)">
        <div class="training-icon">🛡️</div>
        <div class="training-name">防御修炼</div>
        <div class="training-cost">⚡ 25 体力</div>
        <div class="training-gain">+5 防御经验</div>
      </div>
      <div class="training-item" id="train5" onclick="selectTraining(5)">
        <div class="training-icon">🧠</div>
        <div class="training-name">智慧冥想</div>
        <div class="training-cost">⚡ 20 体力</div>
        <div class="training-gain">+5 智力经验</div>
      </div>
      <div class="training-item" id="train6" onclick="selectTraining(6)">
        <div class="training-icon">🔥</div>
        <div class="training-name">极限挑战</div>
        <div class="training-cost">⚡ 50 体力</div>
        <div class="training-gain">+15 全属性</div>
      </div>
    </div>
    
    <button class="start-btn" id="startBtn" onclick="startTraining()" disabled>
      🏋️ 选择训练项目
    </button>
    
    <div class="training-animation" id="trainingAnim">🏋️</div>
    
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon">🎉</div>
      <div class="result-title" id="resultTitle">训练完成！</div>
      <div class="result-rewards" id="resultRewards"></div>
    </div>
    
    <div class="progress-card">
      <div class="progress-title">
        <span>今日修炼进度</span>
        <span id="trainingCount">0/5</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="trainingFill" style="width:0%"></div></div>
      <div class="progress-text">完成5次训练可获得额外奖励</div>
    </div>
    
    <div class="attributes-grid">
      <div class="attr-item">
        <div class="attr-icon">💪</div>
        <div class="attr-name">力量</div>
        <div class="attr-value" id="strValue">10</div>
      </div>
      <div class="attr-item">
        <div class="attr-icon">🏃</div>
        <div class="attr-name">敏捷</div>
        <div class="attr-value" id="agiValue">10</div>
      </div>
      <div class="attr-item">
        <div class="attr-icon">⚔️</div>
        <div class="attr-name">战斗</div>
        <div class="attr-value" id="combatValue">10</div>
      </div>
      <div class="attr-item">
        <div class="attr-icon">🛡️</div>
        <div class="attr-name">防御</div>
        <div class="attr-value" id="defValue">10</div>
      </div>
      <div class="attr-item">
        <div class="attr-icon">🧠</div>
        <div class="attr-name">智力</div>
        <div class="attr-value" id="intValue">10</div>
      </div>
      <div class="attr-item">
        <div class="attr-icon">⭐</div>
        <div class="attr-name">综合</div>
        <div class="attr-value" id="totalValue">50</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-title">📊 修炼统计</div>
      <div class="stat-row">
        <span class="stat-label">累计训练次数</span>
        <span class="stat-value" id="totalTrainings">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">累计消耗体力</span>
        <span class="stat-value" id="totalEnergyUsed">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">训练等级</span>
        <span class="stat-value" id="trainingLevel">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">总训练时间</span>
        <span class="stat-value" id="totalTime">0分钟</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const trainings = {
      1: { name: '基础体能', cost: 20, rewards: { str: 5, agi: 0, combat: 0, def: 0, int: 0 }, time: 3 },
      2: { name: '速度训练', cost: 15, rewards: { str: 0, agi: 5, combat: 0, def: 0, int: 0 }, time: 2 },
      3: { name: '战斗技巧', cost: 30, rewards: { str: 0, agi: 0, combat: 8, def: 0, int: 0 }, time: 4 },
      4: { name: '防御修炼', cost: 25, rewards: { str: 0, agi: 0, combat: 0, def: 5, int: 0 }, time: 3 },
      5: { name: '智慧冥想', cost: 20, rewards: { str: 0, agi: 0, combat: 0, def: 0, int: 5 }, time: 3 },
      6: { name: '极限挑战', cost: 50, rewards: { str: 3, agi: 3, combat: 3, def: 3, int: 3 }, time: 6 }
    };
    
    let selectedTraining = null;
    let isTraining = false;
    let trainingTimer = null;
    let currentEnergy = 70;
    let maxEnergy = 100;
    
    // Create sparks
    const sparksContainer = document.getElementById('sparks');
    setInterval(() => {
      if (isTraining) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.left = (20 + Math.random() * 60) + '%';
        sparksContainer.appendChild(spark);
        setTimeout(() => spark.remove(), 3000);
      }
    }, 200);
    
    function selectTraining(id) {
      if (isTraining) return;
      if (currentEnergy < trainings[id].cost) {
        showToast('⚡ 体力不足！', 'error');
        return;
      }
      
      document.querySelectorAll('.training-item').forEach((item, i) => 
        item.classList.toggle('selected', i + 1 === id));
      selectedTraining = id;
      document.getElementById('startBtn').textContent = `🏋️ 开始 ${trainings[id].name}`;
      document.getElementById('startBtn').disabled = false;
    }
    
    function startTraining() {
      if (!selectedTraining || isTraining) return;
      
      const training = trainings[selectedTraining];
      if (currentEnergy < training.cost) {
        showToast('⚡ 体力不足！', 'error');
        return;
      }
      
      isTraining = true;
      currentEnergy -= training.cost;
      updateEnergyDisplay();
      
      document.getElementById('startBtn').disabled = true;
      document.getElementById('trainingAnim').classList.add('active');
      
      showToast(`🏋️ ${training.name}进行中...`, 'info');
      
      let remaining = training.time;
      const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval);
          completeTraining();
        }
      }, 1000);
    }
    
    function completeTraining() {
      isTraining = false;
      document.getElementById('trainingAnim').classList.remove('active');
      
      const training = trainings[selectedTraining];
      
      // Update stats
      const totalTrain = parseInt(document.getElementById('totalTrainings').textContent) + 1;
      const totalEnergy = parseInt(document.getElementById('totalEnergyUsed').textContent) + training.cost;
      const totalTime = parseInt(document.getElementById('totalTime').textContent) + training.time;
      
      document.getElementById('totalTrainings').textContent = totalTrain;
      document.getElementById('totalEnergyUsed').textContent = totalEnergy;
      document.getElementById('totalTime').textContent = totalTime + '分钟';
      
      // Update attributes
      const str = parseInt(document.getElementById('strValue').textContent) + training.rewards.str;
      const agi = parseInt(document.getElementById('agiValue').textContent) + training.rewards.agi;
      const combat = parseInt(document.getElementById('combatValue').textContent) + training.rewards.combat;
      const def = parseInt(document.getElementById('defValue').textContent) + training.rewards.def;
      const int = parseInt(document.getElementById('intValue').textContent) + training.rewards.int;
      const total = str + agi + combat + def + int;
      
      document.getElementById('strValue').textContent = str;
      document.getElementById('agiValue').textContent = agi;
      document.getElementById('combatValue').textContent = combat;
      document.getElementById('defValue').textContent = def;
      document.getElementById('intValue').textContent = int;
      document.getElementById('totalValue').textContent = total;
      
      // Update progress
      const count = totalTrain % 5;
      document.getElementById('trainingCount').textContent = count + '/5';
      document.getElementById('trainingFill').style.width = (count / 5 * 100) + '%';
      
      // Show result
      showResult(training);
      
      // Reset selection
      selectedTraining = null;
      document.querySelectorAll('.training-item').forEach(item => item.classList.remove('selected'));
      document.getElementById('startBtn').textContent = '🏋️ 选择训练项目';
    }
    
    function showResult(training) {
      const card = document.getElementById('resultCard');
      const rewardsDiv = document.getElementById('resultRewards');
      
      let rewardsHtml = '';
      if (training.rewards.str > 0) rewardsHtml += `<div class="reward"><div class="reward-icon">💪</div><div class="reward-value">+${training.rewards.str}</div><div class="reward-label">力量</div></div>`;
      if (training.rewards.agi > 0) rewardsHtml += `<div class="reward"><div class="reward-icon">🏃</div><div class="reward-value">+${training.rewards.agi}</div><div class="reward-label">敏捷</div></div>`;
      if (training.rewards.combat > 0) rewardsHtml += `<div class="reward"><div class="reward-icon">⚔️</div><div class="reward-value">+${training.rewards.combat}</div><div class="reward-label">战斗</div></div>`;
      if (training.rewards.def > 0) rewardsHtml += `<div class="reward"><div class="reward-icon">🛡️</div><div class="reward-value">+${training.rewards.def}</div><div class="reward-label">防御</div></div>`;
      if (training.rewards.int > 0) rewardsHtml += `<div class="reward"><div class="reward-icon">🧠</div><div class="reward-value">+${training.rewards.int}</div><div class="reward-label">智力</div></div>`;
      
      rewardsDiv.innerHTML = rewardsHtml;
      card.classList.add('show');
      
      setTimeout(() => card.classList.remove('show'), 3000);
    }
    
    function updateEnergyDisplay() {
      document.getElementById('currentEnergy').textContent = currentEnergy;
      document.getElementById('energyFill').style.width = (currentEnergy / maxEnergy * 100) + '%';
    }
    
    // Initialize
    selectTraining(1);
  </script>
</body>
</html>
