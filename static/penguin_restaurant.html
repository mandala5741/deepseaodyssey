<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐧 企鹅礁石餐厅 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 60px; background: linear-gradient(180deg, #001828 0%, #003050 50%, #001525 100%); min-height: 100vh; font-family: -apple-system, sans-serif; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,25,45,0.95); border-bottom: 1px solid rgba(255,180,0,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #ffd700; flex: 1; }
    .back-btn { background: none; border: none; color: #ffd700; font-size: 20px; cursor: pointer; }
    .content { padding: 16px; text-align: center; color: #fff; }
    .icon { font-size: 80px; margin: 40px 0 20px; }
    h2 { color: #ffd700; margin-bottom: 16px; }
    .desc { color: rgba(255,255,255,0.7); line-height: 1.8; max-width: 400px; margin: 0 auto 30px; }
    .feature { background: rgba(50,40,0,0.5); border: 1px solid rgba(255,180,0,0.3); border-radius: 12px; padding: 16px; margin: 12px auto; max-width: 400px; text-align: left; }
    .feature-title { color: #ffd700; font-weight: bold; margin-bottom: 8px; }
    .feature-desc { color: rgba(255,255,255,0.6); font-size: 14px; }
    .soon { background: rgba(255,150,0,0.2); border: 1px solid rgba(255,150,0,0.5); color: #ffa500; border-radius: 12px; padding: 14px; max-width: 400px; margin: 20px auto; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🐧 企鹅礁石餐厅</h1>
  </div>
  <div class="content">
    <div class="icon">🐧</div>
    <h2>企鹅礁石餐厅：美食配送</h2>
    <p class="desc">一款轻松的经营+敏捷类游戏！玩家扮演穿着厨师帽的小企鹅，背着外卖箱在海底为各种挑剔的顾客送餐。</p>

    <div class="feature">
      <div class="feature-title">📦 动态订单</div>
      <div class="feature-desc">右上角会出现顾客气泡框，显示他们点的食物（海藻沙拉、磷虾汉堡）。找到对应食材点进行"捕捞"。</div>
    </div>

    <div class="feature">
      <div class="feature-title">🏄 配送挑战</div>
      <div class="feature-desc">送餐路上会有淘气的海豚把食物顶飞，或遇到突然改变方向的水流，需要快速调整游动路线。</div>
    </div>

    <div class="feature">
      <div class="feature-title">⭐ 连击评价</div>
      <div class="feature-desc">连续精准配送可获"五星好评"，短时间内提升游泳速度。偶尔会有大胃王鲨鱼先生点"全家桶"！</div>
    </div>

    <div class="soon">🚧 游戏开发中，敬请期待...</div>
  </div>
</body>
</html>
