<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏴‍☠️ 海盗岛 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { 
      padding-top: 0; 
      background: linear-gradient(180deg, #0d0400 0%, #2a1000 35%, #1a0800 65%, #0d0400 100%);
      min-height: 100vh; overflow-x: hidden;
    }
    .fire-glow {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 30% 80%, rgba(255,100,0,0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 90%, rgba(255,60,0,0.1) 0%, transparent 45%);
      pointer-events: none; z-index: 1; animation: firePulse 4s ease-in-out infinite;
    }
    @keyframes firePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .fog-layer {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 50% 100%, rgba(80,40,0,0.3) 0%, transparent 60%);
      pointer-events: none; z-index: 2; animation: fogDrift 8s ease-in-out infinite;
    }
    @keyframes fogDrift {
      0%, 100% { opacity: 0.5; transform: translateX(-2%); }
      50% { opacity: 0.8; transform: translateX(2%); }
    }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(13,4,0,0.95); border-bottom: 1px solid rgba(255,140,0,0.4); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #ff8c00; flex: 1; text-shadow: 0 0 10px rgba(255,140,0,0.4); }
    .back-btn { background: none; border: none; color: #ff8c00; font-size: 20px; cursor: pointer; padding: 8px; }
    .smoke {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 3;
    }

    /* Floating skulls */
    .skull { position: fixed; font-size: 28px; opacity: 0.12; pointer-events: none; z-index: 4; animation: skullFloat linear infinite; }
    @keyframes skullFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.12; }
      90% { opacity: 0.12; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    /* Pirate ships */
    .pirate-ship { position: fixed; font-size: 36px; opacity: 0.15; pointer-events: none; z-index: 4; animation: shipSail linear infinite; bottom: 25%; }
    @keyframes shipSail {
      0% { transform: translateX(-100px) rotate(-3deg); }
      50% { transform: translateX(50vw) rotate(3deg); }
      100% { transform: translateX(calc(100vw + 100px)) rotate(-3deg); }
    }

    /* Crows */
    .crow { position: fixed; font-size: 22px; opacity: 0.15; pointer-events: none; z-index: 4; animation: crowFly linear infinite; }
    @keyframes crowFly {
      0% { transform: translateX(-60px) translateY(0); }
      25% { transform: translateX(25vw) translateY(-15px); }
      50% { transform: translateX(50vw) translateY(5px); }
      75% { transform: translateX(75vw) translateY(-10px); }
      100% { transform: translateX(calc(100vw + 60px)) translateY(0); }
    }

    /* Lightning */
    .lightning { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 5; opacity: 0; }
    .lightning.flash { animation: lightningFlash 0.3s ease-out; }
    @keyframes lightningFlash {
      0% { opacity: 0; background: transparent; }
      10% { opacity: 1; background: rgba(255,255,200,0.1); }
      20% { opacity: 0.3; }
      30% { opacity: 0.9; background: rgba(255,255,200,0.15); }
      100% { opacity: 0; }
    }

    /* Rum bottle floating */
    .rum { position: fixed; font-size: 20px; opacity: 0.12; pointer-events: none; z-index: 4; animation: rumBob ease-in-out infinite; }
    @keyframes rumBob {
      0%, 100% { transform: translateY(0) rotate(-10deg); opacity: 0.12; }
      50% { transform: translateY(-20px) rotate(10deg); opacity: 0.18; }
    }

    /* Anchor chain */
    .anchor { position: fixed; font-size: 30px; opacity: 0.1; pointer-events: none; z-index: 4; animation: anchorSwing ease-in-out infinite; }
    @keyframes anchorSwing {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }

    /* Parrot */
    .parrot { position: fixed; font-size: 24px; opacity: 0.12; pointer-events: none; z-index: 4; animation: parrotFly ease-in-out infinite; top: 20%; }
    @keyframes parrotFly {
      0% { transform: translateX(-60px) translateY(0); }
      30% { transform: translateX(30vw) translateY(-20px); }
      60% { transform: translateX(60vw) translateY(10px); }
      100% { transform: translateX(calc(100vw + 60px)) translateY(-5px); }
    }

    /* Flame flickers on cards */
    .flame-border { position: relative; }
    .flame-border::after {
      content: ''; position: absolute; bottom: -2px; left: 10%; right: 10%; height: 3px;
      background: linear-gradient(90deg, transparent, rgba(255,100,0,0.5), rgba(255,150,0,0.6), rgba(255,100,0,0.5), transparent);
      animation: flameFlicker 0.5s ease-in-out infinite alternate;
      border-radius: 50%;
    }
    @keyframes flameFlicker {
      0% { opacity: 0.5; transform: scaleX(0.95); }
      100% { opacity: 1; transform: scaleX(1.05); }
    }

    /* Treasure sparkles */
    .sparkle { position: fixed; width: 4px; height: 4px; background: #ffd700; border-radius: 50%; pointer-events: none; z-index: 5; animation: sparkleGlow ease-in-out infinite; box-shadow: 0 0 6px #ffd700; }
    @keyframes sparkleGlow {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Flag waving */
    .flag { position: fixed; font-size: 28px; opacity: 0.15; pointer-events: none; z-index: 4; animation: flagWave ease-in-out infinite; }
    @keyframes flagWave {
      0%, 100% { transform: rotate(-5deg) scaleX(1); }
      50% { transform: rotate(5deg) scaleX(0.95); }
    }

    /* Dramatic vignette */
    .vignette { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 6; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.5) 100%); }

    .content { 
      margin-top: 60px; 
      padding: 12px; 
      position: relative;
      z-index: 10;
    }
    
    /* Player Stats */
    .stats-card {
      background: rgba(26,10,0,0.85);
      border: 2px solid #ff8c00;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    
    /* Battle Area */
    .battle-card {
      background: rgba(26,10,0,0.85);
      border: 2px solid #ff8c00;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;
    }
    .monster-display { font-size: 80px; margin: 20px 0; animation: monsterIdle 2s ease-in-out infinite; }
    @keyframes monsterIdle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .monster-name { font-size: 18px; color: #ff8c00; margin-bottom: 8px; }
    .monster-level { font-size: 12px; color: rgba(255,140,0,0.7); margin-bottom: 12px; }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-hp-text { font-size: 12px; color: #ff8c00; }
    
    /* Attack Button */
    .attack-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff4500, #ff6600);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }
    .attack-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Result */
    .result-card {
      background: rgba(26,10,0,0.9);
      border: 2px solid #ffd43b;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 12px;
    }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
    
    /* Monster List */
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn {
      background: rgba(255,140,0,0.2);
      border: 1px solid rgba(255,140,0,0.5);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .monster-btn:hover { background: rgba(255,140,0,0.4); transform: scale(1.02); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.2); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #ff8c00; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(255,140,0,0.6); }
    
    /* Progress */
    .quest-progress {
      background: rgba(26,10,0,0.85);
      border: 2px solid #ff8c00;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .quest-title { font-size: 14px; color: #ff8c00; margin-bottom: 8px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(255,140,0,0.8); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="fire-glow"></div>
  <div class="fog-layer"></div>
  <div class="smoke"></div>
  <div class="lightning" id="lightning"></div>
  <div id="skullContainer"></div>
  <div id="shipContainer"></div>
  <div id="crowContainer"></div>
  <div id="rumContainer"></div>
  <div id="anchorContainer"></div>
  <div id="parrotContainer"></div>
  <div id="flagContainer"></div>
  <div id="sparkleContainer"></div>
  <div class="vignette"></div>
  
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🏴‍☠️ 海盗岛</h1>
  </div>

  <div class="content">
    <!-- Player Stats -->
    <div class="stats-card">
      <div class="card-title" style="color:#ff8c00;margin-bottom:8px">⚔️ 我的状态</div>
      <div class="stat-bar">
        <div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div>
      </div>
      <div class="stat-row">
        <span>❤️ HP: <span id="playerHp">0/0</span></span>
        <span>⚡ 体力: <span id="playerEnergy">0</span></span>
      </div>
      <div class="stat-bar" style="margin-top:8px">
        <div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div>
      </div>
      <div class="stat-row">
        <span>📈 Lv.<span id="playerLevel">1</span></span>
        <span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span>
      </div>
    </div>
    
    <!-- Monster Selection -->
    <div class="battle-card">
      <div class="card-title" style="color:#ff8c00;margin-bottom:12px">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    
    <!-- Battle Area -->
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title" style="color:#ff8c00">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🦞</div>
      <div class="monster-name" id="monsterName">海盗虾</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar">
        <div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div>
      </div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" id="attackBtn" onclick="attack()">⚔️ 攻击</button>
    </div>
    
    <!-- Quest Progress -->
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="quest-title">📋 海盗岛任务进度</div>
      <div class="quest-bar">
        <div class="quest-fill" id="questFill" style="width:0%"></div>
      </div>
      <div class="quest-text">击杀海盗: <span id="questCount">0</span>/10</div>
    </div>
    
    <!-- Result -->
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    // Monster data
    const monsters = [
      { id: 1, name: '海盗虾', icon: '🦞', level: 1, hp: 80, attack: 15, exp: 30, gold: 10 },
      { id: 2, name: '骷髅海盗', icon: '💀', level: 3, hp: 150, attack: 25, exp: 60, gold: 25 },
      { id: 3, name: '双刀海盗', icon: '⚔️', level: 5, hp: 250, attack: 40, exp: 100, gold: 50 },
      { id: 4, name: '海盗船长', icon: '🏴‍☠️', level: 8, hp: 500, attack: 70, exp: 200, gold: 100 },
      { id: 5, name: '火焰海盗', icon: '🔥', level: 10, hp: 800, attack: 100, exp: 350, gold: 150 },
      { id: 6, name: '海盗王', icon: '👑', level: 15, hp: 1500, attack: 150, exp: 600, gold: 300 },
    ];
    
    let currentMonster = null;
    let playerData = {};
    let questKills = 0;
    let questGoal = 10;
    let battleInProgress = false;
    
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) {
          playerData = data.player;
          updatePlayerUI();
        }
      } catch (e) { console.log('Failed to load player'); }
    }
    
    function updatePlayerUI() {
      const hp = playerData.hp || 0;
      const maxHp = playerData.max_hp || 100;
      const exp = playerData.exp || 0;
      const level = playerData.level || 1;
      const maxExp = level * level * 100;
      const energy = playerData.energy || 0;
      
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = energy;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    
    function renderMonsterList() {
      const list = document.getElementById('monsterList');
      list.innerHTML = monsters.map(m => `
        <div class="monster-btn" onclick="selectMonster(${m.id})">
          <div class="monster-btn-icon">${m.icon}</div>
          <div class="monster-btn-name">${m.name}</div>
          <div class="monster-btn-level">Lv.${m.level}</div>
        </div>
      `).join('');
    }
    
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      
      // Update selection UI
      document.querySelectorAll('.monster-btn').forEach((btn, i) => {
        btn.classList.toggle('selected', monsters[i].id === id);
      });
      
      // Show battle area
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      
      // Update monster display
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      
      battleInProgress = true;
    }
    
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      
      const playerAttack = Math.floor(playerData.power / 10) + 5;
      const monsterAttack = currentMonster.attack;
      
      // Player attacks monster
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      
      // Update monster HP
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      
      // Check if monster defeated
      if (currentMonster.hp <= 0) {
        battleInProgress = false;
        questKills++;
        updateQuestProgress();
        showResult(true);
        return;
      }
      
      // Monster attacks back (if player has HP)
      const newHp = playerData.hp - monsterAttack;
      if (newHp <= 0) {
        // Player defeated
        playerData.hp = 0;
        battleInProgress = false;
        showResult(false);
      } else {
        playerData.hp = newHp;
      }
      updatePlayerUI();
    }
    
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        
        // Auto-refresh after 2s to select new monster
        setTimeout(() => {
          document.getElementById('resultArea').style.display = 'none';
          document.getElementById('questProgress').style.display = 'none';
          document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected'));
          currentMonster = null;
        }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        
        setTimeout(() => {
          loadPlayerData(); // Restore HP
          document.getElementById('resultArea').style.display = 'none';
        }, 2000);
      }
    }
    
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / questGoal) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      
      if (questKills >= questGoal) {
        showToast('🎉 海盗岛任务完成！');
      }
    }
    
    // Initialize
    loadPlayerData();
    renderMonsterList();

    // ---- Pirate atmosphere elements ----
    // Floating skulls
    const skullContainer = document.getElementById('skullContainer');
    const skullIcons = ['💀','☠️','💀','🦴'];
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('div');
      s.className = 'skull';
      s.textContent = skullIcons[i % skullIcons.length];
      s.style.left = (5 + i * 20) + '%';
      s.style.animationDuration = (18 + i * 5) + 's';
      s.style.animationDelay = (i * 3) + 's';
      skullContainer.appendChild(s);
    }

    // Pirate ships
    const shipContainer = document.getElementById('shipContainer');
    const shipIcons = ['🏴‍☠️','🚢','⛵'];
    for (let i = 0; i < 3; i++) {
      const sh = document.createElement('div');
      sh.className = 'pirate-ship';
      sh.textContent = shipIcons[i];
      sh.style.left = (i * 30) + '%';
      sh.style.animationDuration = (50 + i * 15) + 's';
      sh.style.animationDelay = (i * 18) + 's';
      sh.style.fontSize = (28 + i * 6) + 'px';
      shipContainer.appendChild(sh);
    }

    // Crows
    const crowContainer = document.getElementById('crowContainer');
    for (let i = 0; i < 4; i++) {
      const c = document.createElement('div');
      c.className = 'crow';
      c.textContent = '🦅';
      c.style.top = (8 + i * 12) + '%';
      c.style.animationDuration = (20 + i * 6) + 's';
      c.style.animationDelay = (i * 7) + 's';
      crowContainer.appendChild(c);
    }

    // Rum bottles
    const rumContainer = document.getElementById('rumContainer');
    const rumIcons = ['🍾','🍷','🍶'];
    for (let i = 0; i < 4; i++) {
      const r = document.createElement('div');
      r.className = 'rum';
      r.textContent = rumIcons[i % rumIcons.length];
      r.style.left = (8 + i * 22) + '%';
      r.style.bottom = (15 + Math.random() * 20) + '%';
      r.style.animationDuration = (3 + Math.random() * 2) + 's';
      r.style.animationDelay = (i * 1.5) + 's';
      rumContainer.appendChild(r);
    }

    // Anchors
    const anchorContainer = document.getElementById('anchorContainer');
    for (let i = 0; i < 2; i++) {
      const a = document.createElement('div');
      a.className = 'anchor';
      a.textContent = '⚓';
      a.style.right = (10 + i * 25) + '%';
      a.style.bottom = (5 + i * 3) + '%';
      a.style.fontSize = (24 + i * 8) + 'px';
      a.style.animationDuration = (4 + i * 1.5) + 's';
      a.style.animationDelay = (i * 2) + 's';
      anchorContainer.appendChild(a);
    }

    // Parrots
    const parrotContainer = document.getElementById('parrotContainer');
    for (let i = 0; i < 2; i++) {
      const p = document.createElement('div');
      p.className = 'parrot';
      p.textContent = '🦜';
      p.style.top = (12 + i * 18) + '%';
      p.style.animationDuration = (25 + i * 10) + 's';
      p.style.animationDelay = (i * 12) + 's';
      parrotContainer.appendChild(p);
    }

    // Flags
    const flagContainer = document.getElementById('flagContainer');
    const flagIcons = ['🏴‍☠️','🚩','🏁'];
    for (let i = 0; i < 3; i++) {
      const f = document.createElement('div');
      f.className = 'flag';
      f.textContent = flagIcons[i];
      f.style.left = (5 + i * 30) + '%';
      f.style.top = (5 + i * 3) + '%';
      f.style.fontSize = (22 + i * 4) + 'px';
      f.style.animationDuration = (2.5 + i * 0.5) + 's';
      f.style.animationDelay = (i * 0.8) + 's';
      flagContainer.appendChild(f);
    }

    // Sparkles
    const sparkleContainer = document.getElementById('sparkleContainer');
    for (let i = 0; i < 15; i++) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      sp.style.left = Math.random() * 100 + '%';
      sp.style.top = (20 + Math.random() * 60) + '%';
      sp.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      sp.style.animationDelay = (Math.random() * 4) + 's';
      sparkleContainer.appendChild(sp);
    }

    // Random lightning flash
    const lightningEl = document.getElementById('lightning');
    function triggerLightning() {
      lightningEl.classList.remove('flash');
      void lightningEl.offsetWidth;
      lightningEl.classList.add('flash');
    }
    setInterval(() => { if (Math.random() < 0.3) triggerLightning(); }, 6000);
  </script>
</body>
</html>
