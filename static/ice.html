<!-- atmosphere-added: 🧊 冰封海峡 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧊 冰封海峡 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #0a1a2e 0%, #1a3a5c 40%, #0a1a2e 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(10,26,46,0.95); border-bottom: 1px solid rgba(173,216,230,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #add8e6; flex: 1; }
    .back-btn { background: none; border: none; color: #add8e6; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(10,26,46,0.85); border: 2px solid #add8e6; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #add8e6; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: iceFloat 3s ease-in-out infinite; }
    @keyframes iceFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-15px) rotate(3deg); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #add8e6; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(173,216,230,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #add8e6; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(173,216,230,0.1); border: 1px solid rgba(173,216,230,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(173,216,230,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #add8e6; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(173,216,230,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #87ceeb, #add8e6); border: none; border-radius: 12px; color: #0a1a2e; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(173,216,230,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 🧊 冰封海峡 */

    .aurora { position:fixed;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(100,200,255,0.06) 0%,rgba(150,100,255,0.04) 50%,transparent 100%);pointer-events:none;z-index:1;animation:auroraShift 8s ease-in-out infinite; }
    @keyframes auroraShift { 0%,100%{opacity:0.5;transform:translateX(-3%)}50%{opacity:0.9;transform:translateX(3%)} }
    .snowflake { position:fixed;color:rgba(255,255,255,0.7);pointer-events:none;z-index:3;animation:snowFall linear infinite; }
    @keyframes snowFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:0.8}90%{opacity:0.6}100%{transform:translateY(100vh) rotate(360deg);opacity:0} }
    .ice-crystal { position:fixed;font-size:22px;opacity:0.12;pointer-events:none;z-index:2;animation:iceCrystalShimmer ease-in-out infinite; }
    @keyframes iceCrystalShimmer { 0%,100%{opacity:0.08;transform:scale(1) rotate(0deg)}50%{opacity:0.2;transform:scale(1.15) rotate(30deg)} }
    .frost-edge { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 80px rgba(173,216,230,0.08); }
    .blizzard { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:4;opacity:0.05;background:repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,0.3) 2px,rgba(255,255,255,0.3) 4px);animation:blizzardMove 0.5s linear infinite; }
    @keyframes blizzardMove { 0%{transform:translateX(0)}100%{transform:translateX(4px)} }
    .icicle { position:fixed;top:-10px;width:6px;background:linear-gradient(180deg,rgba(200,230,255,0.6),transparent);border-radius:0 0 50% 50%;pointer-events:none;z-index:3;animation:icicleDrip linear infinite; }
    @keyframes icicleDrip { 0%{transform:translateY(0);opacity:0.8}100%{transform:translateY(100vh);opacity:0} }
    .penguin { position:fixed;font-size:26px;opacity:0.1;pointer-events:none;z-index:3;animation:penguinWaddle ease-in-out infinite; }
    @keyframes penguinWaddle { 0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)} }
    .polar-bear { position:fixed;font-size:40px;opacity:0.08;pointer-events:none;z-index:2;animation:bearIdle ease-in-out infinite; }
    @keyframes bearIdle { 0%,100%{transform:translateX(0)}50%{transform:translateX(15px)} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,30,60,0.5) 100%); }
</style>
</head>
<body>
  
  <div class="aurora"></div>
  <div class="frost-edge"></div>
  <div class="blizzard"></div>
  <div id="snowContainer"></div>
  <div id="iceCrystalContainer"></div>
  <div id="icicleContainer"></div>
  <div id="animalContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🧊 冰封海峡</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">❄️</div>
      <div class="monster-name" id="monsterName">冰霜蟹</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 冰封海峡任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">击败冰元素: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '冰霜蟹', icon: '🦀', level: 2, hp: 90, attack: 16, exp: 32, gold: 11 },
      { id: 2, name: '雪怪', icon: '⛄', level: 4, hp: 160, attack: 28, exp: 65, gold: 26 },
      { id: 3, name: '冰精灵', icon: '🧊', level: 6, hp: 280, attack: 42, exp: 110, gold: 52 },
      { id: 4, name: '冰龙', icon: '🐉', level: 10, hp: 550, attack: 75, exp: 200, gold: 95 },
      { id: 5, name: '极地巨兽', icon: '🦣', level: 13, hp: 900, attack: 110, exp: 380, gold: 165 },
      { id: 6, name: '冰霜之王', icon: '👑', level: 18, hp: 1800, attack: 165, exp: 650, gold: 320 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => `<div class="monster-btn" onclick="selectMonster(${m.id})"><div class="monster-btn-icon">${m.icon}</div><div class="monster-btn-name">${m.name}</div><div class="monster-btn-level">Lv.${m.level}</div></div>`).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2000);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 冰封海峡任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Ice atmosphere
    const snowC = document.getElementById('snowContainer');
    for(let i=0;i<30;i++){const s=document.createElement('div');s.className='snowflake';s.textContent=['❄','❅','❆','✦','•'][i%5];s.style.left=Math.random()*100+'%';s.style.fontSize=(Math.random()*14+8)+'px';s.style.animationDuration=(Math.random()*8+6)+'s';s.style.animationDelay=(Math.random()*8)+'s';snowC.appendChild(s);}
    const iceC = document.getElementById('iceCrystalContainer');
    ['❄','❅','❆','🔹','🧊'].forEach((icon,i)=>{const c=document.createElement('div');c.className='ice-crystal';c.textContent=icon;c.style.left=(5+i*20)+'%';c.style.top=(10+i*12)+'%';c.style.animationDuration=(3+Math.random()*2)+'s';c.style.animationDelay=(i*0.7)+'s';iceC.appendChild(c);});
    const icc = document.getElementById('icicleContainer');
    for(let i=0;i<8;i++){const ic=document.createElement('div');ic.className='icicle';ic.style.left=(5+i*12)+'%';ic.style.height=(30+Math.random()*50)+'px';ic.style.animationDuration=(3+Math.random()*3)+'s';ic.style.animationDelay=(i*1.2)+'s';icc.appendChild(ic);}
    const ac = document.getElementById('animalContainer');
    ['🐧','🐻‍❄️','🦭'].forEach((icon,i)=>{const a=document.createElement('div');a.className=icon==='🐧'?'penguin':icon==='🐻‍❄️'?'polar-bear':'penguin';a.textContent=icon;a.style.left=(10+i*30)+'%';a.style.bottom=(5+i*3)+'%';a.style.animationDuration=(4+Math.random()*3)+'s';a.style.animationDelay=(i*2)+'s';ac.appendChild(a);});

</script>
</body>
</html>
