<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐠 海底总动员 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 60px; background: linear-gradient(180deg, #001830 0%, #003060 50%, #001520 100%); min-height: 100vh; font-family: -apple-system, sans-serif; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,30,60,0.95); border-bottom: 1px solid rgba(0,150,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #60c0ff; flex: 1; }
    .back-btn { background: none; border: none; color: #60c0ff; font-size: 20px; cursor: pointer; }
    .content { padding: 16px; text-align: center; color: #fff; }
    .icon { font-size: 80px; margin: 40px 0 20px; }
    h2 { color: #60c0ff; margin-bottom: 16px; }
    .desc { color: rgba(255,255,255,0.7); line-height: 1.8; max-width: 400px; margin: 0 auto 30px; }
    .feature { background: rgba(0,40,80,0.5); border: 1px solid rgba(0,150,255,0.3); border-radius: 12px; padding: 16px; margin: 12px auto; max-width: 400px; text-align: left; }
    .feature-title { color: #60c0ff; font-weight: bold; margin-bottom: 8px; }
    .feature-desc { color: rgba(255,255,255,0.6); font-size: 14px; }
    .soon { background: rgba(255,150,0,0.2); border: 1px solid rgba(255,150,0,0.5); color: #ffa500; border-radius: 12px; padding: 14px; max-width: 400px; margin: 20px auto; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🐠 海底总动员</h1>
  </div>
  <div class="content">
    <div class="icon">🐠</div>
    <h2>海底总动员：潮汐大冒险</h2>
    <p class="desc">基于电影IP的跑酷类游戏！玩家扮演马林或尼莫，在澳大利亚洋流中高速穿梭。</p>

    <div class="feature">
      <div class="feature-title">🌊 洋流滑道</div>
      <div class="feature-desc">场景是半透明的管道状洋流。左右滑动控制鱼的位置，上下滑动可以跳跃或下滑，穿过由海藻形成的拱门。</div>
    </div>

    <div class="feature">
      <div class="feature-title">海鸥追击</div>
      <div class="feature-desc">中途会有海鸥俯冲下来试图叼走玩家，需要快速左右摇摆或下潜躲避。</div>
    </div>

    <div class="feature">
      <div class="feature-title">🐢 龟壳护盾</div>
      <div class="feature-desc">碰到海龟可以短暂获得龟壳护盾，能撞碎障碍物。钻入鱼群可触发"鱼群风暴"冲刺加速！</div>
    </div>

    <div class="soon">🚧 游戏开发中，敬请期待...</div>
  </div>
</body>
</html>
