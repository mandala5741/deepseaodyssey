<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐾 宠物系统 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { 
      padding-top: 0; 
      background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 30%, #1a0a2e 60%, #0d0518 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(26,10,46,0.95); border-bottom: 1px solid rgba(200,100,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #da70d6; flex: 1; }
    .back-btn { background: none; border: none; color: #da70d6; font-size: 20px; cursor: pointer; padding: 8px; }
    
    /* Stars background */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }
    
    /* Floating hearts */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 16px;
      animation: floatHeart 6s ease-in-out infinite;
      opacity: 0.4;
    }
    @keyframes floatHeart {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
    
    .content { 
      margin-top: 60px; 
      padding: 12px; 
      position: relative;
      z-index: 10;
    }
    
    .pet-card {
      background: rgba(45,27,78,0.8);
      border: 2px solid rgba(200,100,255,0.4);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(5px);
    }
    
    .pet-showcase {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .pet-character {
      text-align: center;
      animation: petBounce 2s ease-in-out infinite;
    }
    .pet-character:nth-child(1) { animation-delay: 0s; }
    .pet-character:nth-child(2) { animation-delay: 0.3s; }
    .pet-character:nth-child(3) { animation-delay: 0.6s; }
    @keyframes petBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .pet-icon { font-size: 50px; }
    .pet-name { font-size: 11px; color: #da70d6; margin-top: 6px; }
    
    .pet-info {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
    }
    .pet-info h4 { color: #da70d6; font-size: 13px; margin-bottom: 8px; }
    .pet-info p { color: rgba(255,255,255,0.7); font-size: 12px; line-height: 1.6; }
    
    .pet-abilities {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .ability {
      background: rgba(200,100,255,0.15);
      border: 1px solid rgba(200,100,255,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .ability-icon { font-size: 20px; margin-bottom: 4px; }
    .ability-name { font-size: 11px; color: #da70d6; }
    .ability-desc { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    
    .companion-section { margin-top: 16px; }
    .companion-title { font-size: 14px; color: #da70d6; margin-bottom: 10px; text-align: center; }
    .companion-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .companion {
      background: rgba(200,100,255,0.1);
      border: 1px solid rgba(200,100,255,0.3);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      transition: all 0.3s;
    }
    .companion:hover {
      background: rgba(200,100,255,0.2);
      transform: scale(1.05);
    }
    .companion.locked { opacity: 0.4; }
    .companion-icon { font-size: 28px; }
    .companion-name { font-size: 10px; color: rgba(255,255,255,0.7); margin-top: 4px; }
    .companion-status { font-size: 9px; color: rgba(100,200,100,0.8); margin-top: 2px; }
    .companion.locked .companion-status { color: #ff6b6b; }
    
    .develop-tag { 
      background: rgba(200,100,255,0.2); 
      color: #da70d6; 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-size: 12px;
      border: 1px solid rgba(200,100,255,0.4);
      margin-top: 16px;
      display: inline-block;
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 5px rgba(200,100,255,0.3); }
      50% { box-shadow: 0 0 20px rgba(200,100,255,0.6); }
    }
    
    .tip-box {
      background: rgba(255,200,100,0.1);
      border: 1px solid rgba(255,200,100,0.3);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }
    .tip-box h4 { color: #ffd700; font-size: 12px; margin-bottom: 6px; }
    .tip-box p { color: rgba(255,255,255,0.6); font-size: 11px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>
  
  <div class="header">
    <button class="back-btn" onclick="location.href='/main.html'">←</button>
    <h1>🐾 宠物系统</h1>
  </div>

  <div class="content">
    <div class="pet-card">
      <div class="pet-showcase">
        <div class="pet-character">
          <div class="pet-icon">🦞</div>
          <div class="pet-name">小虾</div>
        </div>
        <div class="pet-character">
          <div class="pet-icon">🐙</div>
          <div class="pet-name">章小八</div>
        </div>
        <div class="pet-character">
          <div class="pet-icon">🐠</div>
          <div class="pet-name">鱼小白</div>
        </div>
      </div>
      
      <div class="pet-info">
        <h4>🌟 宠物伙伴</h4>
        <p>在深海的冒险中，你可以遇见各种奇妙的海洋生物，它们愿意成为你的伙伴，陪着你一起探索这片未知的世界！</p>
      </div>
      
      <div class="pet-abilities">
        <div class="ability">
          <div class="ability-icon">⚔️</div>
          <div class="ability-name">协助战斗</div>
          <div class="ability-desc">宠物会助战</div>
        </div>
        <div class="ability">
          <div class="ability-icon">💪</div>
          <div class="ability-name">属性加成</div>
          <div class="ability-desc">增加角色属性</div>
        </div>
        <div class="ability">
          <div class="ability-icon">🎒</div>
          <div class="ability-name">背包扩展</div>
          <div class="ability-desc">额外存储空间</div>
        </div>
        <div class="ability">
          <div class="ability-icon">✨</div>
          <div class="ability-name">特殊技能</div>
          <div class="ability-desc">独有天赋能力</div>
        </div>
      </div>
      
      <div class="develop-tag">⚠️ 宠物系统正在加紧培育中</div>
    </div>
    
    <div class="pet-card">
      <div class="companion-title">🐚 海底生物图鉴 🐚</div>
      <div class="companion-list">
        <div class="companion">
          <div class="companion-icon">🦞</div>
          <div class="companion-name">小虾</div>
          <div class="companion-status">已解锁</div>
        </div>
        <div class="companion">
          <div class="companion-icon">🐙</div>
          <div class="companion-name">章小八</div>
          <div class="companion-status">已解锁</div>
        </div>
        <div class="companion">
          <div class="companion-icon">🐠</div>
          <div class="companion-name">鱼小白</div>
          <div class="companion-status">已解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🦈</div>
          <div class="companion-name">鲨大力</div>
          <div class="companion-status">未解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🐢</div>
          <div class="companion-name">龟丞相</div>
          <div class="companion-status">未解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🦑</div>
          <div class="companion-name">乌贼怪</div>
          <div class="companion-status">未解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🐋</div>
          <div class="companion-name">蓝鲸王</div>
          <div class="companion-status">未解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🦀</div>
          <div class="companion-name">蟹老板</div>
          <div class="companion-status">未解锁</div>
        </div>
        <div class="companion locked">
          <div class="companion-icon">🐡</div>
          <div class="companion-name">河豚君</div>
          <div class="companion-status">未解锁</div>
        </div>
      </div>
      
      <div class="tip-box">
        <h4>💡 提示</h4>
        <p>完成特定任务和挑战可解锁新的宠物伙伴！每个宠物都有独特的外观和技能。</p>
      </div>
    </div>
  </div>

  <script>
    // Create twinkling stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }
    
    // Create floating hearts
    const heartsContainer = document.getElementById('hearts');
    const heartTypes = ['💜', '💙', '💚', '🩷', '🤍'];
    for (let i = 0; i < 8; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = heartTypes[Math.floor(Math.random() * heartTypes.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heartsContainer.appendChild(heart);
    }
  </script>
</body>
</html>
