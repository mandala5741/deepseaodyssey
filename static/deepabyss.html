<!-- atmosphere-added: 🌊 海底深渊 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌊 海底深渊 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; background: linear-gradient(180deg, #000010 0%, #000050 40%, #000010 100%); min-height: 100vh; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: rgba(0,0,16,0.95); border-bottom: 1px solid rgba(0,150,255,0.3); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: #00bfff; flex: 1; }
    .back-btn { background: none; border: none; color: #00bfff; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; position: relative; z-index: 10; }
    .stats-card, .battle-card, .quest-progress, .result-card { background: rgba(0,0,16,0.85); border: 2px solid #00bfff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; color: #00bfff; margin-bottom: 8px; }
    .stat-bar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; margin: 8px 0; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    .stat-bar-fill.hp { background: linear-gradient(90deg, #ff4444, #ff6b6b); }
    .stat-bar-fill.exp { background: linear-gradient(90deg, #ffd43b, #f59f00); }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #ffd43b; margin-top: 4px; }
    .monster-display { font-size: 80px; margin: 20px 0; animation: deepFloat 4s ease-in-out infinite; }
    @keyframes deepFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    .monster-hp-bar { height: 16px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .monster-hp-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff6b6b); transition: width 0.3s; }
    .monster-name { font-size: 18px; color: #00bfff; margin-bottom: 4px; }
    .monster-level { font-size: 12px; color: rgba(0,191,255,0.7); margin-bottom: 8px; }
    .monster-hp-text { font-size: 12px; color: #00bfff; }
    .monster-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .monster-btn { background: rgba(0,191,255,0.1); border: 1px solid rgba(0,191,255,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .monster-btn:hover { background: rgba(0,191,255,0.2); }
    .monster-btn.selected { border-color: #ffd43b; background: rgba(255,212,59,0.15); }
    .monster-btn-icon { font-size: 32px; }
    .monster-btn-name { font-size: 11px; color: #00bfff; margin-top: 4px; }
    .monster-btn-level { font-size: 10px; color: rgba(0,191,255,0.6); }
    .attack-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #00bfff, #1e90ff); border: none; border-radius: 12px; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .quest-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; overflow: hidden; }
    .quest-fill { height: 100%; background: linear-gradient(90deg, #ffd43b, #f59f00); transition: width 0.3s; }
    .quest-text { font-size: 12px; color: rgba(0,191,255,0.8); margin-top: 6px; }
    .result-icon { font-size: 48px; margin-bottom: 12px; }
    .result-text { font-size: 18px; color: #ffd43b; margin-bottom: 8px; }
    .result-reward { font-size: 14px; color: rgba(255,212,59,0.8); }
  
    /* Atmosphere: 🌊 海底深渊 */

    .deep-darkness { position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,20,0.4) 0%,rgba(0,0,0,0.8) 100%);pointer-events:none;z-index:1; }
    .abyss-vortex { position:fixed;top:50%;left:50%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent,rgba(0,0,80,0.2),rgba(0,0,50,0.15),rgba(0,0,100,0.1),transparent);pointer-events:none;z-index:2;animation:abyssVortexSpin 30s linear infinite;border-radius:50%; }
    @keyframes abyssVortexSpin { 0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(-360deg)} }
    .biolum { position:fixed;width:4px;height:4px;background:radial-gradient(circle,rgba(0,200,255,0.9),rgba(0,100,200,0.3));border-radius:50%;pointer-events:none;z-index:5;animation:biolumPulse ease-in-out infinite;box-shadow:0 0 8px rgba(0,200,255,0.7),0 0 15px rgba(0,150,255,0.4); }
    @keyframes biolumPulse { 0%,100%{opacity:0.15;transform:scale(0.7)}50%{opacity:1;transform:scale(1.6)} }
    .leviathan { position:fixed;font-size:50px;opacity:0;animation:leviathanGlide linear infinite;pointer-events:none;z-index:4; }
    @keyframes leviathanGlide { 0%{transform:translateX(-120px) translateY(0) rotate(-5deg);opacity:0}15%{opacity:0.1}85%{opacity:0.08}100%{transform:translateX(calc(100vw + 120px)) translateY(-50px) rotate(5deg);opacity:0} }
    .pressure-fish { position:fixed;font-size:22px;opacity:0;animation:pressureFish linear infinite;pointer-events:none;z-index:4; }
    @keyframes pressureFish { 0%{transform:translateY(0) translateX(0);opacity:0}20%{opacity:0.12}80%{opacity:0.1}100%{transform:translateY(-40px) translateX(15px);opacity:0} }
    .bone { position:fixed;font-size:18px;opacity:0.06;pointer-events:none;z-index:3;animation:boneDrift linear infinite; }
    @keyframes boneDrift { 0%{transform:translateY(100vh) rotate(0deg);opacity:0}20%{opacity:0.06}80%{opacity:0.05}100%{transform:translateY(-30px) rotate(180deg);opacity:0} }
    .vignette { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 50%,transparent 15%,rgba(0,0,0,0.85) 100%); }
</style>
</head>
<body>
  
  <div class="deep-darkness"></div>
  <div class="abyss-vortex"></div>
  <div id="biolumContainer"></div>
  <div id="leviathanContainer"></div>
  <div id="pressureFishContainer"></div>
  <div id="boneContainer"></div>
  <div class="vignette"></div>
  <div class="header">
    <button class="back-btn" onclick="location.href='/seas.html'">←</button>
    <h1>🌊 海底深渊</h1>
  </div>
  <div class="content">
    <div class="stats-card">
      <div class="card-title">⚔️ 我的状态</div>
      <div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div>
      <div class="stat-row"><span>❤️ HP: <span id="playerHp">0/0</span></span><span>⚡ 体力: <span id="playerEnergy">0</span></span></div>
      <div class="stat-bar" style="margin-top:8px"><div class="stat-bar-fill exp" id="playerExpBar" style="width:0%"></div></div>
      <div class="stat-row"><span>📈 Lv.<span id="playerLevel">1</span></span><span>EXP: <span id="playerExp">0</span>/<span id="playerMaxExp">100</span></span></div>
    </div>
    <div class="battle-card">
      <div class="card-title">🎯 选择目标</div>
      <div class="monster-list" id="monsterList"></div>
    </div>
    <div class="battle-card" id="battleArea" style="display:none">
      <div class="card-title">⚔️ 战斗中</div>
      <div class="monster-display" id="monsterDisplay">🦞</div>
      <div class="monster-name" id="monsterName">深渊虾</div>
      <div class="monster-level" id="monsterLevel">Lv.1</div>
      <div class="monster-hp-bar"><div class="monster-hp-fill" id="monsterHpFill" style="width:100%"></div></div>
      <div class="monster-hp-text">❤️ <span id="monsterHp">100</span>/<span id="monsterMaxHp">100</span></div>
      <button class="attack-btn" onclick="attack()">⚔️ 攻击</button>
    </div>
    <div class="quest-progress" id="questProgress" style="display:none">
      <div class="card-title">📋 海底深渊任务进度</div>
      <div class="quest-bar"><div class="quest-fill" id="questFill" style="width:0%"></div></div>
      <div class="quest-text">击败深渊怪物: <span id="questCount">0</span>/10</div>
    </div>
    <div class="result-card" id="resultArea" style="display:none">
      <div class="result-icon" id="resultIcon">🏆</div>
      <div class="result-text" id="resultText">胜利！</div>
      <div class="result-reward" id="resultReward">+50 经验 +10 金贝</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/shared.js"></script>
  <script>
    const monsters = [
      { id: 1, name: '深渊虾', icon: '🦐', level: 4, hp: 150, attack: 28, exp: 60, gold: 25 },
      { id: 2, name: '深海海怪', icon: '🐙', level: 6, hp: 280, attack: 45, exp: 110, gold: 50 },
      { id: 3, name: '巨型章鱼', icon: '🦑', level: 8, hp: 450, attack: 65, exp: 180, gold: 85 },
      { id: 4, name: '深渊巨兽', icon: '🦈', level: 11, hp: 750, attack: 95, exp: 300, gold: 140 },
      { id: 5, name: '远古海龙', icon: '🐉', level: 14, hp: 1100, attack: 130, exp: 480, gold: 220 },
      { id: 6, name: '深渊之主', icon: '👹', level: 20, hp: 2200, attack: 200, exp: 850, gold: 420 },
    ];
    let currentMonster = null, playerData = {}, questKills = 0, battleInProgress = false;
    async function loadPlayerData() {
      try {
        const res = await fetch(`${API_BASE}/player/profile`, { headers: getAuthHeader() });
        const data = await res.json();
        if (data.player) { playerData = data.player; updatePlayerUI(); }
      } catch (e) {}
    }
    function updatePlayerUI() {
      const hp = playerData.hp || 0, maxHp = playerData.max_hp || 100, exp = playerData.exp || 0, level = playerData.level || 1, maxExp = level * level * 100;
      document.getElementById('playerHp').textContent = `${hp}/${maxHp}`;
      document.getElementById('playerHpBar').style.width = `${(hp/maxHp*100).toFixed(1)}%`;
      document.getElementById('playerEnergy').textContent = playerData.energy || 0;
      document.getElementById('playerLevel').textContent = level;
      document.getElementById('playerExp').textContent = exp;
      document.getElementById('playerMaxExp').textContent = maxExp;
      document.getElementById('playerExpBar').style.width = `${(exp/maxExp*100).toFixed(1)}%`;
    }
    function renderMonsterList() {
      document.getElementById('monsterList').innerHTML = monsters.map(m => `<div class="monster-btn" onclick="selectMonster(${m.id})"><div class="monster-btn-icon">${m.icon}</div><div class="monster-btn-name">${m.name}</div><div class="monster-btn-level">Lv.${m.level}</div></div>`).join('');
    }
    function selectMonster(id) {
      currentMonster = monsters.find(m => m.id === id);
      if (!currentMonster) return;
      document.querySelectorAll('.monster-btn').forEach((btn, i) => btn.classList.toggle('selected', monsters[i].id === id));
      document.getElementById('battleArea').style.display = 'block';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questProgress').style.display = 'block';
      document.getElementById('monsterDisplay').textContent = currentMonster.icon;
      document.getElementById('monsterName').textContent = currentMonster.name;
      document.getElementById('monsterLevel').textContent = `Lv.${currentMonster.level}`;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterMaxHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = '100%';
      battleInProgress = true;
    }
    function attack() {
      if (!battleInProgress || !currentMonster) return;
      const playerAttack = Math.floor((playerData.power || 10) / 10) + 5;
      currentMonster.hp -= playerAttack;
      if (currentMonster.hp < 0) currentMonster.hp = 0;
      const hpPct = (currentMonster.hp / currentMonster.maxHp) * 100;
      document.getElementById('monsterHp').textContent = currentMonster.hp;
      document.getElementById('monsterHpFill').style.width = `${hpPct}%`;
      if (currentMonster.hp <= 0) { battleInProgress = false; questKills++; updateQuestProgress(); showResult(true); return; }
      const newHp = playerData.hp - currentMonster.attack;
      playerData.hp = newHp <= 0 ? 0 : newHp;
      updatePlayerUI();
      if (playerData.hp <= 0) { battleInProgress = false; showResult(false); }
    }
    async function showResult(won) {
      document.getElementById('battleArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      if (won) {
        document.getElementById('resultIcon').textContent = '🏆';
        document.getElementById('resultText').textContent = '胜利！';
        document.getElementById('resultReward').textContent = `+${currentMonster.exp} 经验 +${currentMonster.gold} 金贝`;
        // Call backend for equipment drop
        try {
          const res = await fetch(`${API_BASE}/abyss/claim_reward`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
            body: JSON.stringify({ monster_level: currentMonster.level })
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById('resultReward').textContent += ` + 🗡️装备 + 💎5碎片`;
            showToast(`🎉 获得 ${data.equipment?.name || '装备'}！`);
          }
        } catch(e) { console.error('abyss reward error:', e); }
        setTimeout(() => { document.getElementById('resultArea').style.display = 'none'; document.getElementById('questProgress').style.display = 'none'; document.querySelectorAll('.monster-btn').forEach(btn => btn.classList.remove('selected')); currentMonster = null; }, 2500);
      } else {
        document.getElementById('resultIcon').textContent = '💀';
        document.getElementById('resultText').textContent = '战败...';
        document.getElementById('resultReward').textContent = '休息一下再来吧';
        setTimeout(() => { loadPlayerData(); document.getElementById('resultArea').style.display = 'none'; }, 2000);
      }
    }
    function updateQuestProgress() {
      const pct = Math.min(100, (questKills / 10) * 100);
      document.getElementById('questFill').style.width = `${pct}%`;
      document.getElementById('questCount').textContent = questKills;
      if (questKills >= 10) showToast('🎉 海底深渊任务完成！');
    }
    loadPlayerData();
    renderMonsterList();
  

    // Deep abyss atmosphere
    const bioC = document.getElementById('biolumContainer');
    for(let i=0;i<25;i++){const b=document.createElement('div');b.className='biolum';b.style.left=Math.random()*100+'%';b.style.top=Math.random()*80+'%';b.style.animationDuration=(1.5+Math.random()*3)+'s';b.style.animationDelay=(Math.random()*5)+'s';bioC.appendChild(b);}
    const levC = document.getElementById('leviathanContainer');
    ['🐋','🦈','🦑'].forEach((icon,i)=>{const l=document.createElement('div');l.className='leviathan';l.textContent=icon;l.style.top=(15+i*25)+'%';l.style.animationDuration=(60+i*25)+'s';l.style.animationDelay=(i*30)+'s';l.style.fontSize=(40+i*15)+'px';levC.appendChild(l);});
    const pfc = document.getElementById('pressureFishContainer');
    const pfIcons = ['🐟','🦈','🐡','🦑','🐙','🐟'];
    for(let i=0;i<8;i++){const p=document.createElement('div');p.className='pressure-fish';p.textContent=pfIcons[i%pfIcons.length];p.style.left=(5+i*12)+'%';p.style.bottom=(10+Math.random()*25)+'%';p.style.animationDuration=(10+i*3)+'s';p.style.animationDelay=(i*3)+'s';p.style.fontSize=(16+Math.random()*10)+'px';pfc.appendChild(p);}
    const boneC = document.getElementById('boneContainer');
    ['🦴','💀','🦴'].forEach((icon,i)=>{const b=document.createElement('div');b.className='bone';b.textContent=icon;b.style.left=(10+i*28)+'%';b.style.fontSize=(16+Math.random()*8)+'px';b.style.animationDuration=(12+Math.random()*8)+'s';b.style.animationDelay=(i*4)+'s';boneC.appendChild(b);});

</script>
</body>
</html>
