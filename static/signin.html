<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎁 签到 - 深海掠夺者</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { padding-top: 0; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; z-index: 100; }
    .header h1 { font-size: 16px; color: var(--accent); flex: 1; }
    .back-btn { background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 8px; }
    .content { margin-top: 60px; padding: 12px; text-align: center; }
    .signin-info { background: var(--bg-card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .signin-info h2 { color: var(--accent); margin-bottom: 8px; }
    .signin-info p { color: var(--text-dim); font-size: 14px; }
    .signin-btn { width: 100%; padding: 20px; background: var(--accent); color: #001a10; border: none; border-radius: 16px; font-size: 18px; cursor: pointer; }
    .signin-btn:disabled { background: rgba(0,212,170,0.3); cursor: not-allowed; }
    .reward-list { margin: 16px 0; text-align: left; }
    .reward-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .reward-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/main.html'">←</button>
    <h1>🎁 每日签到</h1>
  </div>

  <div class="content">
    <div class="signin-info">
      <h2>📅 每日签到</h2>
      <p>每天签到可获得奖励</p>
      <div class="reward-list">
        <div class="reward-item">
          <span>💰 金贝</span>
          <span style="color:var(--gold)">+500</span>
        </div>
        <div class="reward-item">
          <span>🪙 银贝</span>
          <span style="color:var(--silver)">+1000</span>
        </div>
        <div class="reward-item">
          <span>📈 经验</span>
          <span style="color:#ffd43b">+2000</span>
        </div>
      </div>
    </div>
    <button id="signinBtn" class="signin-btn" onclick="doSignin()">🎁 立即签到</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    async function loadSigninStatus() {
      try {
        const res = await fetch(`${API_BASE}/signin/status`, { headers: getAuthHeader() });
        const data = await res.json();
        const btn = document.getElementById('signinBtn');
        if (data.signed_today) {
          btn.disabled = true;
          btn.textContent = '✅ 今日已签到';
        }
      } catch (e) { showToast('加载失败', 'error'); }
    }

    async function doSignin() {
      try {
        const res = await fetch(`${API_BASE}/signin`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeader() } });
        const data = await res.json();
        if (data.success || data.code === 0) {
          let msg = `签到成功！+500金贝 +1000银贝 +2000经验`;
          if (data.level_up) {
            msg += ` 🎉 升级了！当前Lv.${data.new_level}`;
          }
          showToast(msg);
          loadSigninStatus();
        } else {
          showToast(data.message || '签到失败', 'error');
        }
      } catch (e) { showToast('网络错误', 'error'); }
    }

    loadSigninStatus();
  </script>
</body>
</html>
